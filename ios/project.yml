name: Beid
options:
  bundleIdPrefix: org.levarac.beid
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
packages:
  Barnard:
    url: https://github.com/levarac/barnard.git
    exactVersion: 0.9.2
  MetaMask:
    # Archived, non-commercially licensed dependency, now linked into
    # Release (DECISIONS 2026-08-21 "#250 で MetaMask を Release へ昇格させる"):
    # WalletConnect (Reown) was removed as beid's third wallet option, and
    # without MetaMask promoted the shipping build would have offered no
    # direct-connect wallet at all (Coinbase Wallet was beid's other option
    # then; it was removed outright later, thegreeting/beid#270). Keep this
    # exact pin — an upgrade needs the same physical-device review as this
    # promotion did. The connect → sign → return round trip has never been
    # verified on a real device; that verification is a still-owed release
    # gate, tracked in docs/field-test-procedure.md, not something this
    # change completes.
    url: https://github.com/MetaMask/metamask-ios-sdk
    exactVersion: 0.8.10
targets:
  Beid:
    type: application
    platform: iOS
    sources:
      - Beid
    preBuildScripts:
      - name: Build BeidSharedKit
        shell: /bin/sh
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          KMP_JAVA_HOME="$("$SRCROOT/../scripts/resolve_kmp_java_home.sh")"
          export JAVA_HOME="$KMP_JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "Using KMP JDK: $JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          cd "$SRCROOT/../android"
          ./gradlew :shared:embedSwiftExportForXcode --no-daemon
    dependencies:
      - package: Barnard
        product: Barnard
      - package: Barnard
        product: BarnardCore
      - target: BeidMetaMaskSupport
    info:
      path: Beid/App/Info.plist
      properties:
        UILaunchScreen: {}
        # Single appearance (beid#632, DESIGN.md §14): the app does not follow
        # the OS dark-mode setting. An Info.plist key rather than a SwiftUI
        # modifier, because it applies to every window the process shows —
        # the launch screen, sheets, alerts, the keyboard and the status bar —
        # and to system colors and materials, which no single-valued colorset
        # reaches. Black screens are a state drawn with ink, not an appearance.
        UIUserInterfaceStyle: Light
        # Release template (TestFlight/App Store): skips the per-upload
        # export-compliance question. The basis was "HTTPS/BLE only" until
        # gh#250 promoted MetaMask to Release (DECISIONS 2026-08-21), which
        # links the SDK's crypto (including -lecies) into the shipping
        # binary. The declaration is left at false because ECIES is standard
        # cryptography, not proprietary or otherwise non-exempt — but the
        # stated basis changed, so re-confirm this before the next upload
        # rather than assuming the old justification still describes the app.
        ITSAppUsesNonExemptEncryption: false
        BeidEventRegistryReaderAddress: "$(BEID_EVENT_REGISTRY_READER_ADDRESS)"
        BeidEtherscanAPIKey: "$(BEID_ETHERSCAN_API_KEY)"
        BeidEventDefinitionURLTemplate: "$(BEID_EVENT_DEFINITION_URL_TEMPLATE)"
        BeidEventKeySetURLTemplate: "$(BEID_EVENT_KEY_SET_URL_TEMPLATE)"
        BeidVenueBundleURLTemplate: "$(BEID_VENUE_BUNDLE_URL_TEMPLATE)"
        BeidEventCodeLookupURLTemplate: "$(BEID_EVENT_CODE_LOOKUP_URL_TEMPLATE)"
        BeidEventCodeHashLookupURLTemplate: "$(BEID_EVENT_CODE_HASH_LOOKUP_URL_TEMPLATE)"
        BeidEventKeySignPersonhoodCallbackURL: "$(BEID_EVENT_KEY_SIGN_PERSONHOOD_CALLBACK_URL)"
        BeidEventKeySignClaimCallbackURL: "$(BEID_EVENT_KEY_SIGN_CLAIM_CALLBACK_URL)"
        BeidReportSubmissionEnabled: "$(BEID_REPORT_SUBMISSION_ENABLED)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSBluetoothAlwaysUsageDescription: "beid uses Bluetooth to automatically sense nearby events and collect proof of attendance."
        NSBluetoothPeripheralUsageDescription: "beid uses Bluetooth to automatically sense nearby events and collect proof of attendance."
        NSCameraUsageDescription: "beid uses the camera only to scan a venue link QR code when a venue device is set up."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - beid
        LSApplicationQueriesSchemes:
          - metamask
        # Flat 2b typefaces (beid#629), bundled from Beid/DesignSystem/Fonts
        # with upstream file names. The static cuts are the Google Fonts named
        # instances at opsz 14, which is what the Figma Library renders.
        # Provenance lives here rather than in a README beside the files: the
        # Beid and BeidLab targets source that whole tree, so a README there
        # is copied into both app bundles as a resource.
        #   BricolageGrotesque-ExtraBold.ttf  v1.001  ateliertriay/bricolage
        #     @84745e5b96261ae5f8c6c856e262fe78d1d6efdd fonts/ttf/
        #     sha256 20ca28c496aef07993031176c1a02da6959682abbc4cbf73776f83e63ef80c00
        #   DMSans-Bold.ttf  v4.004  googlefonts/dm-fonts
        #     @4412393b7d2de9fe7a92064c2dce9b5af5d7fd26 Sans/fonts/ttf/
        #     sha256 6a6924b35d757e32b21d611733d5b9a7bb6234b07b75334b0e2d2359985b26ee
        #   DMSans-Regular.ttf  v4.004  same repo, commit and path
        #     sha256 a95a338942aa357145427be7c963ff691f9fe859c3512d9c0483e1914d57a208
        #   DMMono-Medium.ttf  v1.000  google/fonts
        #     @e44c4b011a820c2cbe2fd2cfa8052037d7edb571 ofl/dmmono/
        #     sha256 fd327daf461db87b44a87def475d251bf03b997f7c07d9680592d75dbbfaad0b
        #     no tnum, but it is a monospaced face
        # Licenses: each family's OFL.txt from google/fonts @e44c4b0
        # (ofl/bricolagegrotesque, ofl/dmsans, ofl/dmmono), content unmodified,
        # renamed OFL-BricolageGrotesque.txt / OFL-DMSans.txt / OFL-DMMono.txt
        # because resources are flattened to the bundle root, where three
        # files called OFL.txt collide. No Reserved Font Name is declared and
        # every face has fsType 0.
        # opsz-14 check: hmtx advance widths against the pinned google/fonts
        # variable font instantiated with fontTools.varLib.instancer, over the
        # glyphs the two share. Bricolage (opsz 14, wght 800, wdth 100): 0 of
        # 597 mismatch. DM Sans Bold (opsz 14, wght 700): 0 of 486. DM Sans
        # Regular (opsz 14, wght 400): 36 of 486, each exactly 1 unit with the
        # static wider; every other optical size is far worse (opsz 9: 373,
        # 12: 343, 18: 258, 24: 341). So the widths are rounding-close, not
        # equal.
        UIAppFonts:
          - BricolageGrotesque-ExtraBold.ttf
          - DMSans-Bold.ttf
          - DMSans-Regular.ttf
          - DMMono-Medium.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.levarac.beid
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 4WQE792998
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        BEID_EVENT_REGISTRY_READER_ADDRESS: "0xd4852f8526A1555A1b2C34145f0eCDA412a53c51"
        BEID_ETHERSCAN_API_KEY: ""
        # Non-secret: a public URL on the already-deployed operator
        # (levarac/parallax#8, #16, #17), not a credential — committed
        # directly here, matching BEID_EVENT_REGISTRY_READER_ADDRESS above,
        # rather than routed through CI-only injection. The actual GHA
        # release pipeline (scripts/gha/build-and-upload-ios.sh) passes no
        # BEID_EVENT_* build settings to xcodebuild at all, and Xcode Cloud
        # is currently unfunded — a value that only exists as an
        # externally-injected build setting would not reach any real build
        # right now. Route existence verified live via curl before committing:
        # GET /artifacts/definitions/<real policy digest> -> 200 with the
        # signed EventDefinition CBOR bytes; GET .../<a wrong digest> -> 404,
        # not 500 (confirms the route, not just a lucky match).
        BEID_EVENT_DEFINITION_URL_TEMPLATE: "https://parallax-observation-operator.levarac.workers.dev/artifacts/definitions/{definitionHash}"
        # Canonical Observation submission is opt-in. Endpoint, receipt key,
        # event identity, digest, and validity are supplied only by the
        # verified Event Definition fetched through the registry module.
        BEID_REPORT_SUBMISSION_ENABLED: "NO"
        # Event-key signing entry point: the only places a signature may be
        # sent, one per purpose: the alcor join page and the mizar claim page.
        # A non-https or empty value disables that purpose.
        BEID_EVENT_KEY_SIGN_PERSONHOOD_CALLBACK_URL: "https://alcor-human-check.levarac.workers.dev/"
        BEID_EVENT_KEY_SIGN_CLAIM_CALLBACK_URL: "https://levarac-mizar-claim.levarac.workers.dev/"
        # Same non-secret reasoning as BEID_EVENT_DEFINITION_URL_TEMPLATE
        # above. Route existence verified live: GET /artifacts/key-sets/<a
        # wrong digest> -> 404 "EventKeySet artifact not found", not 500.
        BEID_EVENT_KEY_SET_URL_TEMPLATE: "https://parallax-observation-operator.levarac.workers.dev/artifacts/key-sets/{keySetDigest}"
        # Same non-secret reasoning (beid#258 P1-1). Route verified live this
        # session: GET /v1/events/by-code/parallax-demo -> 200 with the
        # registered eventId.
        BEID_EVENT_CODE_LOOKUP_URL_TEMPLATE: "https://parallax-observation-operator.levarac.workers.dev/v1/events/by-code/{code}"
        BEID_EVENT_CODE_HASH_LOOKUP_URL_TEMPLATE: "https://parallax-observation-operator.levarac.workers.dev/v1/events/by-code-hash/{hash}"
        BEID_VENUE_BUNDLE_URL_TEMPLATE: ""
        # XcodeGen 2.45.3 has no configuration filter for package
        # dependencies. BeidMetaMaskSupport keeps the package build-order
        # dependency stable, while this OTHER_LDFLAGS entry links the pinned
        # package's static product objects and binary target. It lives in
        # `base`, not a single config, because MetaMask is promoted to
        # Release as well as Debug (DECISIONS 2026-08-21) — both configs
        # need the same linkage.
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "$(BUILT_PRODUCTS_DIR)/metamask-ios-sdk.o"
          - "$(BUILT_PRODUCTS_DIR)/SocketIO.o"
          - "$(BUILT_PRODUCTS_DIR)/Starscream.o"
          - "-lecies"
      configs:
        Release:
          # Runner-only indirection: empty under Xcode Cloud, explicit in GHA.
          PROVISIONING_PROFILE_SPECIFIER: "$(BEID_PROVISIONING_PROFILE)"
  BeidMetaMaskSupport:
    type: library.static
    platform: iOS
    sources:
      - BeidMetaMaskSupport
    dependencies:
      - package: MetaMask
        product: metamask-ios-sdk
    settings:
      base:
        SWIFT_VERSION: "5.0"
  BeidLab:
    type: application
    platform: iOS
    sources:
      - path: Beid
        excludes:
          - App/BeidApp.swift
          - App/Info.plist
      - Lab
    preBuildScripts:
      - name: Build BeidSharedKit
        shell: /bin/sh
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          KMP_JAVA_HOME="$("$SRCROOT/../scripts/resolve_kmp_java_home.sh")"
          export JAVA_HOME="$KMP_JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"
          cd "$SRCROOT/../android"
          ./gradlew :shared:embedSwiftExportForXcode --no-daemon
    dependencies:
      - package: Barnard
        product: Barnard
      - package: Barnard
        product: BarnardCore
      - target: BeidMetaMaskSupport
    info:
      path: Lab/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Declared here so regeneration keeps it. f1ff25e added this key to
        # Lab/Info.plist by hand without adding it to project.yml, so the
        # next `xcodegen generate` would silently drop it, and
        # `ReportSubmissionRuntime.isEnabled` reads it from the bundle.
        BeidReportSubmissionEnabled: "$(BEID_REPORT_SUBMISSION_ENABLED)"
        NSBluetoothAlwaysUsageDescription: "beid Lab uses Bluetooth for the device harness."
        # BeidLab compiles the same DesignSystem (and bundles the same font
        # files) as Beid. Without this key, Font.custom falls back to the
        # system font here with no error, so the Lab would not render Flat 2b.
        UIAppFonts:
          - BricolageGrotesque-ExtraBold.ttf
          - DMSans-Bold.ttf
          - DMSans-Regular.ttf
          - DMMono-Medium.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.levarac.beid.lab
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 4WQE792998
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEVICE_HARNESS"
        BEID_REPORT_SUBMISSION_ENABLED: "NO"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "$(BUILT_PRODUCTS_DIR)/metamask-ios-sdk.o"
          - "$(BUILT_PRODUCTS_DIR)/SocketIO.o"
          - "$(BUILT_PRODUCTS_DIR)/Starscream.o"
          - "-lecies"
  BeidTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BeidTests
      - path: ../shared/src/commonTest/fixtures/demo-scenarios.txt
        buildPhase: resources
      # One frozen public artifact for the venue provider/consumer contract.
      - path: ../shared/src/commonTest/fixtures/vectors/positive/venue-current-lease-v1.json
        buildPhase: resources
      - path: BeidTests/Fixtures/venue-bundle-conformance
        type: folder
        buildPhase: resources
      # The app's source tree, copied into the test bundle as a folder
      # reference. `ParticipantRelayIsolationTests` reads app source to assert
      # that certain names appear nowhere in it, and a test bundle cannot
      # assume the checkout is on disk when it runs: Xcode Cloud's test action
      # executes the built bundle on a machine where the repository is not at
      # the path `#filePath` records. A folder reference rather than a file
      # list, so a new `Demo*.swift` is picked up by the walk without anyone
      # remembering to add it here.
      - path: Beid
        type: folder
        buildPhase: resources
    dependencies:
      - target: Beid
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
  BeidUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BeidUITests
    dependencies:
      - target: Beid
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BeidLab:
    build:
      targets:
        BeidLab: all
    run:
      config: Debug
  Beid:
    build:
      targets:
        Beid: all
        BeidTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      language: en
      region: US
      targets:
        - BeidTests
        - BeidUITests
