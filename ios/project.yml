name: Beid
options:
  bundleIdPrefix: org.levarac.beid
  deploymentTarget:
    iOS: "17.0"
packages:
  Barnard:
    # Vendored (not a remote git dependency): levarac/barnard's Swift
    # package lives at packages/swift/barnard, not at its repo root, and
    # SwiftPM remote git dependencies require Package.swift at the repo
    # root. Vendored verbatim from levarac/barnard@54385d2 into
    # Vendor/Barnard — see native/ios/README.md "Barnard SDK dependency".
    path: Vendor/Barnard
  WalletConnect:
    # Reown (formerly WalletConnect Inc) — the legacy
    # WalletConnect/WalletConnectSwiftV2 repo is archived; reown-swift is
    # the maintained successor. Pinned to the latest tagged release as of
    # this spike. Only the low-level "WalletConnect" product (Sign +
    # Pairing) is used, not ReownAppKit, to avoid pulling in
    # Yttrium/CoinbaseWalletSDK — see ios/README.md "WalletConnect (spike)".
    url: https://github.com/reown-com/reown-swift
    exactVersion: 2.3.0
targets:
  Beid:
    type: application
    platform: iOS
    sources:
      - Beid
    dependencies:
      - package: Barnard
        product: Barnard
      - package: WalletConnect
        product: WalletConnect
    entitlements:
      path: Beid/App/Beid.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.levarac.beid
    info:
      path: Beid/App/Info.plist
      properties:
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: "beid uses Bluetooth to automatically sense nearby events and collect proof of attendance."
        NSBluetoothPeripheralUsageDescription: "beid uses Bluetooth to automatically sense nearby events and collect proof of attendance."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - beid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.levarac.beid
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
  BeidTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BeidTests
    dependencies:
      - target: Beid
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Beid:
    build:
      targets:
        Beid: all
        BeidTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BeidTests
