name: Beid
options:
  bundleIdPrefix: org.levarac.beid
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
packages:
  Barnard:
    url: https://github.com/levarac/barnard.git
    exactVersion: 0.2.0
  WalletConnect:
    # Reown (formerly WalletConnect Inc) — the legacy
    # WalletConnect/WalletConnectSwiftV2 repo is archived; reown-swift is
    # the maintained successor. Only the low-level "WalletConnect" product
    # (Sign + Pairing) is used, not ReownAppKit, to avoid pulling in
    # Yttrium/CoinbaseWalletSDK surface that doesn't fit beid's
    # WalletConnect-login-no-account-abstraction ruling. Validated by
    # spike/walletconnect-native (commit a22d0f4) on Simulator.
    url: https://github.com/reown-com/reown-swift
    exactVersion: 2.3.0
  CoinbaseWallet:
    # Direct app-to-app wallet transport. Pinned because upstream activity
    # is limited and compatibility must be reviewed before any upgrade.
    url: https://github.com/coinbase/wallet-mobile-sdk
    exactVersion: 1.1.2
  MetaMask:
    # Archived, non-commercially licensed spike dependency. Keep this exact
    # pin: compatibility must be proven on a physical device before any
    # upgrade or non-DEBUG exposure.
    url: https://github.com/MetaMask/metamask-ios-sdk
    exactVersion: 0.8.10
targets:
  Beid:
    type: application
    platform: iOS
    sources:
      - Beid
    dependencies:
      - package: Barnard
        product: Barnard
      - package: Barnard
        product: BarnardCore
      - package: WalletConnect
        product: WalletConnect
      - package: CoinbaseWallet
        product: CoinbaseWalletSDK
      - target: BeidMetaMaskDebug
    info:
      path: Beid/App/Info.plist
      properties:
        UILaunchScreen: {}
        # Release template (TestFlight/App Store): standard crypto only
        # (HTTPS/BLE) => exempt, skips the per-upload export-compliance question.
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSBluetoothAlwaysUsageDescription: "beid uses Bluetooth to automatically sense nearby events and collect proof of attendance."
        NSBluetoothPeripheralUsageDescription: "beid uses Bluetooth to automatically sense nearby events and collect proof of attendance."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - beid
        LSApplicationQueriesSchemes:
          - cbwallet
          - metamask
          - mwp+1.1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.levarac.beid
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 4WQE792998
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          # XcodeGen 2.45.3 has no configuration filter for package
          # dependencies. BeidMetaMaskDebug keeps the package build-order
          # dependency stable, while only Debug links the pinned package's
          # static product objects and binary target.
          OTHER_LDFLAGS:
            - "$(inherited)"
            - "$(BUILT_PRODUCTS_DIR)/metamask-ios-sdk.o"
            - "$(BUILT_PRODUCTS_DIR)/SocketIO.o"
            - "$(BUILT_PRODUCTS_DIR)/Starscream.o"
            - "-lecies"
  BeidMetaMaskDebug:
    type: library.static
    platform: iOS
    sources:
      - BeidMetaMaskDebug
    dependencies:
      - package: MetaMask
        product: metamask-ios-sdk
    settings:
      base:
        SWIFT_VERSION: "5.0"
  BeidTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BeidTests
    dependencies:
      - target: Beid
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
  BeidUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BeidUITests
    dependencies:
      - target: Beid
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Beid:
    build:
      targets:
        Beid: all
        BeidTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BeidTests
        - BeidUITests
