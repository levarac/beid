name: BeidNative
options:
  bundleIdPrefix: network.greeting.beid.native
  deploymentTarget:
    iOS: "17.0"
packages:
  Barnard:
    # Vendored (not a remote git dependency): levarac/barnard's Swift
    # package lives at packages/swift/barnard, not at its repo root, and
    # SwiftPM remote git dependencies require Package.swift at the repo
    # root. Vendored verbatim from levarac/barnard@54385d2 into
    # Vendor/Barnard — see native/ios/README.md "Barnard SDK dependency".
    path: Vendor/Barnard
targets:
  BeidNative:
    type: application
    platform: iOS
    sources:
      - BeidNative
    dependencies:
      - package: Barnard
        product: Barnard
    info:
      path: BeidNative/App/Info.plist
      properties:
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: "beid uses Bluetooth to automatically sense nearby events and collect proof of attendance."
        NSBluetoothPeripheralUsageDescription: "beid uses Bluetooth to automatically sense nearby events and collect proof of attendance."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.greeting.beid.native
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
  BeidNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BeidNativeTests
    dependencies:
      - target: BeidNative
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BeidNative:
    build:
      targets:
        BeidNative: all
        BeidNativeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BeidNativeTests
