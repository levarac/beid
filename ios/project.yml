name: Beid
options:
  bundleIdPrefix: org.levarac.beid
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
packages:
  Barnard:
    url: https://github.com/levarac/barnard.git
    exactVersion: 0.7.0
  MetaMask:
    # Archived, non-commercially licensed dependency, now linked into
    # Release (DECISIONS 2026-08-21 "#250 で MetaMask を Release へ昇格させる"):
    # WalletConnect (Reown) was removed as beid's third wallet option, and
    # without MetaMask promoted the shipping build would have offered no
    # direct-connect wallet at all (Coinbase Wallet was beid's other option
    # then; it was removed outright later, thegreeting/beid#270). Keep this
    # exact pin — an upgrade needs the same physical-device review as this
    # promotion did. The connect → sign → return round trip has never been
    # verified on a real device; that verification is a still-owed release
    # gate, tracked in docs/field-test-procedure.md, not something this
    # change completes.
    url: https://github.com/MetaMask/metamask-ios-sdk
    exactVersion: 0.8.10
targets:
  Beid:
    type: application
    platform: iOS
    sources:
      - Beid
    preBuildScripts:
      - name: Build BeidSharedKit
        shell: /bin/sh
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          KMP_JAVA_HOME="$("$SRCROOT/../scripts/resolve_kmp_java_home.sh")"
          export JAVA_HOME="$KMP_JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "Using KMP JDK: $JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          cd "$SRCROOT/../android"
          ./gradlew :shared:embedSwiftExportForXcode --no-daemon
    dependencies:
      - package: Barnard
        product: Barnard
      - package: Barnard
        product: BarnardCore
      - target: BeidMetaMaskSupport
    info:
      path: Beid/App/Info.plist
      properties:
        UILaunchScreen: {}
        # Release template (TestFlight/App Store): skips the per-upload
        # export-compliance question. The basis was "HTTPS/BLE only" until
        # gh#250 promoted MetaMask to Release (DECISIONS 2026-08-21), which
        # links the SDK's crypto (including -lecies) into the shipping
        # binary. The declaration is left at false because ECIES is standard
        # cryptography, not proprietary or otherwise non-exempt — but the
        # stated basis changed, so re-confirm this before the next upload
        # rather than assuming the old justification still describes the app.
        ITSAppUsesNonExemptEncryption: false
        BeidEventRegistryReaderAddress: "$(BEID_EVENT_REGISTRY_READER_ADDRESS)"
        BeidEtherscanAPIKey: "$(BEID_ETHERSCAN_API_KEY)"
        BeidEventDefinitionURLTemplate: "$(BEID_EVENT_DEFINITION_URL_TEMPLATE)"
        BeidEventKeySetURLTemplate: "$(BEID_EVENT_KEY_SET_URL_TEMPLATE)"
        BeidEventCodeLookupURLTemplate: "$(BEID_EVENT_CODE_LOOKUP_URL_TEMPLATE)"
        BeidEventCodeHashLookupURLTemplate: "$(BEID_EVENT_CODE_HASH_LOOKUP_URL_TEMPLATE)"
        BeidReportSubmissionEnabled: "$(BEID_REPORT_SUBMISSION_ENABLED)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSBluetoothAlwaysUsageDescription: "beid uses Bluetooth to automatically sense nearby events and collect proof of attendance."
        NSBluetoothPeripheralUsageDescription: "beid uses Bluetooth to automatically sense nearby events and collect proof of attendance."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - beid
        LSApplicationQueriesSchemes:
          - metamask
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.levarac.beid
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 4WQE792998
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        BEID_EVENT_REGISTRY_READER_ADDRESS: "0xd4852f8526A1555A1b2C34145f0eCDA412a53c51"
        BEID_ETHERSCAN_API_KEY: ""
        # Non-secret: a public URL on the already-deployed operator
        # (levarac/parallax#8, #16, #17), not a credential — committed
        # directly here, matching BEID_EVENT_REGISTRY_READER_ADDRESS above,
        # rather than routed through CI-only injection. The actual GHA
        # release pipeline (scripts/gha/build-and-upload-ios.sh) passes no
        # BEID_EVENT_* build settings to xcodebuild at all, and Xcode Cloud
        # is currently unfunded — a value that only exists as an
        # externally-injected build setting would not reach any real build
        # right now. Route existence verified live via curl before committing:
        # GET /artifacts/definitions/<real policy digest> -> 200 with the
        # signed EventDefinition CBOR bytes; GET .../<a wrong digest> -> 404,
        # not 500 (confirms the route, not just a lucky match).
        BEID_EVENT_DEFINITION_URL_TEMPLATE: "https://parallax-observation-operator.levarac.workers.dev/artifacts/definitions/{definitionHash}"
        # Canonical Observation submission is opt-in. Endpoint, receipt key,
        # event identity, digest, and validity are supplied only by the
        # verified Event Definition fetched through the registry module.
        BEID_REPORT_SUBMISSION_ENABLED: "NO"
        # Same non-secret reasoning as BEID_EVENT_DEFINITION_URL_TEMPLATE
        # above. Route existence verified live: GET /artifacts/key-sets/<a
        # wrong digest> -> 404 "EventKeySet artifact not found", not 500.
        BEID_EVENT_KEY_SET_URL_TEMPLATE: "https://parallax-observation-operator.levarac.workers.dev/artifacts/key-sets/{keySetDigest}"
        # Same non-secret reasoning (beid#258 P1-1). Route verified live this
        # session: GET /v1/events/by-code/parallax-demo -> 200 with the
        # registered eventId.
        BEID_EVENT_CODE_LOOKUP_URL_TEMPLATE: "https://parallax-observation-operator.levarac.workers.dev/v1/events/by-code/{code}"
        BEID_EVENT_CODE_HASH_LOOKUP_URL_TEMPLATE: "https://parallax-observation-operator.levarac.workers.dev/v1/events/by-code-hash/{hash}"
        # XcodeGen 2.45.3 has no configuration filter for package
        # dependencies. BeidMetaMaskSupport keeps the package build-order
        # dependency stable, while this OTHER_LDFLAGS entry links the pinned
        # package's static product objects and binary target. It lives in
        # `base`, not a single config, because MetaMask is promoted to
        # Release as well as Debug (DECISIONS 2026-08-21) — both configs
        # need the same linkage.
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "$(BUILT_PRODUCTS_DIR)/metamask-ios-sdk.o"
          - "$(BUILT_PRODUCTS_DIR)/SocketIO.o"
          - "$(BUILT_PRODUCTS_DIR)/Starscream.o"
          - "-lecies"
      configs:
        Release:
          # Runner-only indirection: empty under Xcode Cloud, explicit in GHA.
          PROVISIONING_PROFILE_SPECIFIER: "$(BEID_PROVISIONING_PROFILE)"
  BeidMetaMaskSupport:
    type: library.static
    platform: iOS
    sources:
      - BeidMetaMaskSupport
    dependencies:
      - package: MetaMask
        product: metamask-ios-sdk
    settings:
      base:
        SWIFT_VERSION: "5.0"
  BeidTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BeidTests
    dependencies:
      - target: Beid
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
  BeidUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BeidUITests
    dependencies:
      - target: Beid
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Beid:
    build:
      targets:
        Beid: all
        BeidTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      language: en
      region: US
      targets:
        - BeidTests
        - BeidUITests
