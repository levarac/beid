<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- outer dial ring -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#E8EAEC" stroke-width="2"/>
  <!-- faint inner reference circle -->
  <circle cx="100" cy="100" r="44" fill="none" stroke="#E8EAEC" stroke-width="1" stroke-opacity="0.35"/>
  <!-- cardinal ticks (longer) -->
  <line x1="100" y1="30"  x2="100" y2="42"  stroke="#E8EAEC" stroke-width="2"/>
  <line x1="100" y1="170" x2="100" y2="158" stroke="#E8EAEC" stroke-width="2"/>
  <line x1="30"  y1="100" x2="42"  y2="100" stroke="#E8EAEC" stroke-width="2"/>
  <line x1="170" y1="100" x2="158" y2="100" stroke="#E8EAEC" stroke-width="2"/>
  <!-- minor ticks, every 30 degrees -->
  <line x1="135"   y1="39.4"  x2="132"   y2="44.6"  stroke="#E8EAEC" stroke-width="1.5"/>
  <line x1="160.6" y1="65"    x2="155.4" y2="68"    stroke="#E8EAEC" stroke-width="1.5"/>
  <line x1="160.6" y1="135"   x2="155.4" y2="132"   stroke="#E8EAEC" stroke-width="1.5"/>
  <line x1="135"   y1="160.6" x2="132"   y2="155.4" stroke="#E8EAEC" stroke-width="1.5"/>
  <line x1="65"    y1="160.6" x2="68"    y2="155.4" stroke="#E8EAEC" stroke-width="1.5"/>
  <line x1="39.4"  y1="135"   x2="44.6"  y2="132"   stroke="#E8EAEC" stroke-width="1.5"/>
  <line x1="39.4"  y1="65"    x2="44.6"  y2="68"    stroke="#E8EAEC" stroke-width="1.5"/>
  <line x1="65"    y1="39.4"  x2="68"    y2="44.6"  stroke="#E8EAEC" stroke-width="1.5"/>
  <!-- needle, resting off-vertical -->
  <line x1="100" y1="100" x2="128" y2="51.5" stroke="#E8EAEC" stroke-width="2.5" stroke-linecap="round"/>
  <!-- counterweight tail -->
  <line x1="100" y1="100" x2="91" y2="115.6" stroke="#E8EAEC" stroke-width="2.5" stroke-linecap="round"/>
  <!-- pivot -->
  <circle cx="100" cy="100" r="4" fill="#E8EAEC"/>
</svg>
