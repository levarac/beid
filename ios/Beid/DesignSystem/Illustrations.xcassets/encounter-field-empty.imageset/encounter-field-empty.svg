<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- innermost ring: solid, closest to the instrument -->
  <circle cx="100" cy="100" r="24" fill="none" stroke="#2A2E33" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- middle rings dissolve into dashes: range not yet filled -->
  <circle cx="100" cy="100" r="48" fill="none" stroke="#2A2E33" stroke-width="1.5" stroke-opacity="0.4"
          stroke-dasharray="3 7" stroke-linecap="round"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="#2A2E33" stroke-width="1.5" stroke-opacity="0.3"
          stroke-dasharray="2 9" stroke-linecap="round"/>
  <!-- outermost: barely-there dotted horizon of the field -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#2A2E33" stroke-width="1.5" stroke-opacity="0.2"
          stroke-dasharray="0.5 11" stroke-linecap="round"/>
  <!-- aperture around the listening center -->
  <circle cx="100" cy="100" r="9" fill="none" stroke="#2A2E33" stroke-width="1.5" stroke-opacity="0.8"/>
  <!-- the instrument, still on, still sensing -->
  <circle cx="100" cy="100" r="3.5" fill="#18C7A7"/>
  <!-- one faint possible presence at the edge of range -->
  <circle cx="146" cy="57" r="2.5" fill="#18C7A7" fill-opacity="0.45"/>
</svg>
