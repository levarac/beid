# The Android app version, kept in this one file. A version bump edits
# versionName here and nothing else; android/app/build.gradle.kts reads it
# (scripts/tests/test_version_files.py checks that).
#
# versionName is the version users see.
# versionCode is the source-level placeholder. The Google Play delivery
# workflow assigns the store number for every upload (docs/google-play.md),
# so leave it at 1.
versionName=0.1.0
versionCode=1
