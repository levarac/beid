name: Release notes warning

on:
  pull_request_target:
    paths:
      - release_notes.json

permissions:
  contents: read
  pull-requests: write

jobs:
  warn:
    name: Warn about release-only notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add or update release notes warning
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const marker = "<!-- beid-release-notes-warning -->";
            const body = [
              marker,
              "> [!WARNING]",
              "> `release_notes.json` is reserved for App Store release copy. Changing it does **not** deliver notes or a build to TestFlight testers; use `what_to_test.json` for internal TestFlight delivery.",
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
