name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Determine changed paths
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.classify.outputs.android }}
      lint: ${{ steps.classify.outputs.lint }}
      sanity: ${{ steps.classify.outputs.sanity }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Collect changed paths
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const outputPath = `${process.env.RUNNER_TEMP}/beid-changed-files.json`;
            try {
              let files;
              if (context.eventName === 'pull_request') {
                files = await github.paginate(
                  github.rest.pulls.listFiles,
                  { owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number, per_page: 100 },
                  response => response.data.flatMap(file => [file.filename, file.previous_filename].filter(Boolean)),
                );
              } else if (context.eventName === 'push' && context.payload.before && !/^0+$/.test(context.payload.before)) {
                files = await github.paginate(
                  github.rest.repos.compareCommitsWithBasehead,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    basehead: `${context.payload.before}...${context.payload.after}`,
                    per_page: 100,
                  },
                  response => response.data.files.flatMap(file => [file.filename, file.previous_filename].filter(Boolean)),
                );
              } else {
                throw new Error(`unsupported or unbounded event: ${context.eventName}`);
              }
              fs.writeFileSync(outputPath, JSON.stringify({ files }), 'utf8');
            } catch (error) {
              core.warning(`changed-path collection failed; all checks will run: ${error.message}`);
              fs.writeFileSync(outputPath, JSON.stringify({ error: String(error) }), 'utf8');
            }

      - name: Classify changed paths (fail closed)
        id: classify
        if: always()
        run: python3 scripts/ci_change_filter.py --input "$RUNNER_TEMP/beid-changed-files.json" >> "$GITHUB_OUTPUT"

  android:
    name: Android build
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Report separate trusted Parallax comparison
        run: |
          echo "Parallax upstream comparison SKIPPED here; not a passing comparison."
          echo "### Parallax upstream comparison: SKIPPED" >> "$GITHUB_STEP_SUMMARY"
          echo "Private upstream comparison runs only in the protected main workflow; not a passing comparison." >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17.0.20+8"
      - name: Configure job-local Android SDK path
        run: |
          mkdir -p "$RUNNER_TEMP/android-sdk"
          {
            echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk"
            echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk"
          } >> "$GITHUB_ENV"
      - name: Cache Android SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/android-sdk
          key: beid-android-sdk-${{ runner.os }}-${{ runner.arch }}-android36-v1
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platforms;android-36 build-tools;36.0.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build and test Android app
        working-directory: android
        run: |
          java -version
          set -euo pipefail
          mkdir -p build
          ./gradlew :shared:testAndroidHostTest :app:testDebugUnitTest :app:assembleDebug \
            :app:compileDebugAndroidTestKotlin :app:dependencyInsight \
            --dependency barnard --configuration debugRuntimeClasspath \
            --no-daemon --parallel --max-workers=4 --console=plain \
            | tee build/barnard-dependency-insight.log
      - name: Summarize Android test results
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from scripts.run_local_tests import junit_directory, parse_junit_files, format_counts

          problems = []
          for task in (":shared:testAndroidHostTest", ":app:testDebugUnitTest"):
              results = junit_directory(Path.cwd(), task)
              counts = parse_junit_files(sorted(results.glob("**/*.xml")))
              print(f"{task}: {format_counts(counts)}", flush=True)
              if counts.warnings or counts.failed or counts.passed <= 0:
                  problems.append(f"{task}: missing, invalid or failing test evidence")
          if problems:
              raise SystemExit("\n".join(problems))
          PY
      - name: Verify resolved Barnard dependency provenance
        working-directory: android
        run: |
          python3 ../scripts/check_barnard_dependency_provenance.py \
            --build-gradle app/build.gradle.kts \
            --settings-gradle settings.gradle.kts \
            --root-build-gradle build.gradle.kts \
            --dependency-insight-log build/barnard-dependency-insight.log

  lint:
    name: SwiftLint
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.lint == 'true') }}
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select Xcode for SourceKit
        run: echo "DEVELOPER_DIR=/Applications/Xcode_26.5.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Install SwiftLint 0.65.0
        env:
          SWIFTLINT_SHA256: eb333bd76dfb5f46d21fdf3615fe39bb938956ca0b8e94c241c4b2db6e696b90
        run: |
          archive="$RUNNER_TEMP/SwiftLintBinary.artifactbundle.zip"
          install_dir="$RUNNER_TEMP/swiftlint"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/realm/SwiftLint/releases/download/0.65.0/SwiftLintBinary.artifactbundle.zip"
          printf '%s  %s\n' "$SWIFTLINT_SHA256" "$archive" | shasum --algorithm 256 --check --strict
          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          ditto -x -k "$archive" "$install_dir"
          swiftlint_bin="$(find "$install_dir" -type f -path '*/macos/swiftlint' -print -quit)"
          test -n "$swiftlint_bin"
          chmod +x "$swiftlint_bin"
          file "$swiftlint_bin" | grep -E 'arm64|arm64e'
          printf '%s\n' "$(dirname "$swiftlint_bin")" >> "$GITHUB_PATH"
      - name: Check lint prerequisites
        run: |
          git --version
          python3 --version
          swiftlint version
      - name: Run design-contract lint
        run: scripts/lint.sh

  sanity:
    name: Repository sanity
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.sanity == 'true') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        env:
          PYTHON_SHA256: b61b856c3e1a4fc65b8f6e6b0495ef975dd0924f90c59f3ea61b38a079173b84
        run: |
          archive="$RUNNER_TEMP/python-3.12.tar.gz"
          install_dir="$RUNNER_TEMP/python"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.12.14%2B20260901-aarch64-unknown-linux-gnu-install_only.tar.gz"
          printf '%s  %s\n' "$PYTHON_SHA256" "$archive" | sha256sum --check --strict
          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          test "$("$install_dir/python/bin/python3.12" -c 'import sys; print(sys.version_info[:2])')" = "(3, 12)"
          printf '%s\n' "$install_dir/python/bin" >> "$GITHUB_PATH"
      - name: Install YAML parser into the job temp directory
        run: python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/python-packages" PyYAML==6.0.2
      - name: Validate XcodeGen project definition
        run: |
          PYTHONPATH="$RUNNER_TEMP/python-packages" python3 -c 'import pathlib, yaml; yaml.safe_load(pathlib.Path("ios/project.yml").read_text()); print("ios/project.yml is valid YAML")'
      - name: Validate TestFlight note JSON
        run: |
          python3 -c 'import json, pathlib; paths = [pathlib.Path("what_to_test.json"), pathlib.Path("release_notes.json")]; [json.load(path.open(encoding="utf-8")) for path in paths if path.is_file()]; print("TestFlight note JSON is valid")'
      - name: Validate TestFlight note structure
        run: |
          python3 scripts/prepare_testflight_notes.py --source what_to_test.json --output-dir /tmp/what-to-test-notes
          if [ -f release_notes.json ]; then
            python3 scripts/prepare_testflight_notes.py --source release_notes.json --output-dir /tmp/release-notes
          fi
      - name: Check AGENTS.md PR CI section matches this workflow
        run: python3 scripts/check_pr_ci_doc_drift.py
      - name: Run scripts/ contract tests
        run: python3 -m unittest discover -s scripts/tests -t .
