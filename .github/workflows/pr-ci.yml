name: PR CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Determine changed paths
    runs-on: [self-hosted, macOS, ARM64, emi]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.classify.outputs.android }}
      lint: ${{ steps.classify.outputs.lint }}
      sanity: ${{ steps.classify.outputs.sanity }}
    steps:
      - name: Reject fork pull request code on the private runner
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "Fork pull requests are not executed on the private self-hosted runner."
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Collect changed paths
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const outputPath = `${process.env.RUNNER_TEMP}/beid-changed-files.json`;
            try {
              let files;
              if (context.eventName === 'pull_request') {
                files = await github.paginate(
                  github.rest.pulls.listFiles,
                  { owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number, per_page: 100 },
                  response => response.data.flatMap(file => [file.filename, file.previous_filename].filter(Boolean)),
                );
              } else if (context.eventName === 'push' && context.payload.before && !/^0+$/.test(context.payload.before)) {
                files = await github.paginate(
                  github.rest.repos.compareCommitsWithBasehead,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    basehead: `${context.payload.before}...${context.payload.after}`,
                    per_page: 100,
                  },
                  response => response.data.files.flatMap(file => [file.filename, file.previous_filename].filter(Boolean)),
                );
              } else {
                throw new Error(`unsupported or unbounded event: ${context.eventName}`);
              }
              fs.writeFileSync(outputPath, JSON.stringify({ files }), 'utf8');
            } catch (error) {
              core.warning(`changed-path collection failed; all checks will run: ${error.message}`);
              fs.writeFileSync(outputPath, JSON.stringify({ error: String(error) }), 'utf8');
            }

      - name: Classify changed paths (fail closed)
        id: classify
        if: always()
        run: python3 scripts/ci_change_filter.py --input "$RUNNER_TEMP/beid-changed-files.json" >> "$GITHUB_OUTPUT"

  android:
    name: Android build
    needs: changes
    if: ${{ always() && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || needs.changes.result != 'success' || needs.changes.outputs.android == 'true') }}
    runs-on: [self-hosted, macOS, ARM64, emi]
    timeout-minutes: 20
    steps:
      - name: Reject fork pull request code on the private runner
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "Fork pull requests are not executed on the private self-hosted runner."
          exit 1
      - uses: actions/checkout@v4
      - name: Clone Parallax at the pinned commit
        env:
          PARALLAX_READ_TOKEN: ${{ secrets.PARALLAX_READ_TOKEN }}
        run: scripts/clone_parallax_pinned.sh
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17.0.20+8"
      - name: Configure job-local Android SDK path
        run: |
          mkdir -p "$RUNNER_TEMP/android-sdk"
          {
            echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk"
            echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk"
          } >> "$GITHUB_ENV"
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-sdk
          key: beid-android-sdk-${{ runner.os }}-${{ runner.arch }}-android36-v1
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-36 build-tools;36.0.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test Android app
        working-directory: android
        run: |
          java -version
          ./gradlew :shared:testAndroidHostTest :app:testDebugUnitTest :app:assembleDebug --no-daemon --no-parallel
      - name: Verify the Parallax comparison actually ran
        if: env.PARALLAX_REPO != ''
        run: scripts/check_parallax_comparison_ran.py
      - name: Compile Android instrumented tests
        working-directory: android
        run: ./gradlew :app:compileDebugAndroidTestKotlin --no-daemon --no-parallel
      - name: Capture Barnard dependency resolution
        working-directory: android
        run: |
          mkdir -p build
          ./gradlew :app:dependencyInsight --dependency barnard --configuration debugRuntimeClasspath --no-daemon > build/barnard-dependency-insight.log
          cat build/barnard-dependency-insight.log
      - name: Verify resolved Barnard dependency provenance
        working-directory: android
        run: |
          python3 ../scripts/check_barnard_dependency_provenance.py \
            --build-gradle app/build.gradle.kts \
            --settings-gradle settings.gradle.kts \
            --root-build-gradle build.gradle.kts \
            --dependency-insight-log build/barnard-dependency-insight.log

  lint:
    name: SwiftLint
    needs: changes
    if: ${{ always() && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || needs.changes.result != 'success' || needs.changes.outputs.lint == 'true') }}
    runs-on: [self-hosted, macOS, ARM64, emi]
    timeout-minutes: 10
    steps:
      - name: Reject fork pull request code on the private runner
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "Fork pull requests are not executed on the private self-hosted runner."
          exit 1
      - uses: actions/checkout@v4
      - name: Select Xcode for SourceKit
        run: echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Install SwiftLint 0.65.0
        env:
          SWIFTLINT_SHA256: eb333bd76dfb5f46d21fdf3615fe39bb938956ca0b8e94c241c4b2db6e696b90
        run: |
          archive="$RUNNER_TEMP/SwiftLintBinary.artifactbundle.zip"
          install_dir="$RUNNER_TEMP/swiftlint"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/realm/SwiftLint/releases/download/0.65.0/SwiftLintBinary.artifactbundle.zip"
          printf '%s  %s\n' "$SWIFTLINT_SHA256" "$archive" | shasum --algorithm 256 --check --strict
          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          ditto -x -k "$archive" "$install_dir"
          swiftlint_bin="$(find "$install_dir" -type f -path '*/macos/swiftlint' -print -quit)"
          test -n "$swiftlint_bin"
          chmod +x "$swiftlint_bin"
          file "$swiftlint_bin" | grep -E 'arm64|arm64e'
          printf '%s\n' "$(dirname "$swiftlint_bin")" >> "$GITHUB_PATH"
      - name: Check lint prerequisites
        run: |
          git --version
          python3 --version
          swiftlint version
      - name: Run design-contract lint
        run: scripts/lint.sh

  sanity:
    name: Repository sanity
    needs: changes
    if: ${{ always() && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || needs.changes.result != 'success' || needs.changes.outputs.sanity == 'true') }}
    runs-on: [self-hosted, macOS, ARM64, emi]
    timeout-minutes: 10
    steps:
      - name: Reject fork pull request code on the private runner
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "Fork pull requests are not executed on the private self-hosted runner."
          exit 1
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/toolcache
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/toolcache
        with:
          python-version: '3.12'
      - name: Validate XcodeGen project definition
        run: |
          ruby -e 'require "yaml"; YAML.safe_load(File.read("ios/project.yml"), aliases: true); puts "ios/project.yml is valid YAML"'
      - name: Validate TestFlight note JSON
        run: |
          python3 -c 'import json, pathlib; paths = [pathlib.Path("what_to_test.json"), pathlib.Path("release_notes.json")]; [json.load(path.open(encoding="utf-8")) for path in paths if path.is_file()]; print("TestFlight note JSON is valid")'
      - name: Validate TestFlight note structure
        run: |
          python3 scripts/prepare_testflight_notes.py --source what_to_test.json --output-dir /tmp/what-to-test-notes
          if [ -f release_notes.json ]; then
            python3 scripts/prepare_testflight_notes.py --source release_notes.json --output-dir /tmp/release-notes
          fi
      - name: Check AGENTS.md PR CI section matches this workflow
        run: python3 scripts/check_pr_ci_doc_drift.py
      - name: Run scripts/ contract tests
        run: python3 -m unittest discover -s scripts/tests -t .
