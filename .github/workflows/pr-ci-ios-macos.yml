name: PR iOS CI

on:
  # Always report a status for every PR head, including drafts. Workflow-level
  # path filters would leave a required context pending on unrelated changes.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    # Measure the merged result on main exactly once. Note the concurrency
    # group below is keyed on github.ref with cancel-in-progress, so two merges
    # landing back to back cancel the earlier main run: this guarantees a run
    # starts per merge, not that every one finishes.
    branches: [main]
    paths:
      - ".github/workflows/pr-ci-ios-macos.yml"
      - "ios/**"
      - "shared/**"
      - "android/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "android/gradle.properties"
      - "android/gradlew"
      - "android/gradle/wrapper/**"
      - "scripts/resolve_kmp_java_home.sh"
      - "scripts/download_xcodegen.sh"
      - "scripts/ci_simulator.py"
      - "scripts/ci_ios_results.py"
  # Escape hatch: run this lane against any ref on demand. `paths` does not
  # apply to workflow_dispatch, so a manual run always executes.
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
  GRADLE_OPTS: -Dorg.gradle.caching=true

concurrency:
  group: pr-ios-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    name: Build iOS test products
    # Keep PR code on disposable hosted runners; repository variables must
    # never route a fork pull request back to a persistent signing host.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Initialize CI output path
        shell: bash
        run: |
          set -euo pipefail
          printf 'CI_OUTPUT_ROOT=%s\n' "$RUNNER_TEMP/beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        # Default policy: PRs read caches; only main writes Gradle state.

      - name: Cache Kotlin Native dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.konan
          key: beid-ios-konan-${{ runner.os }}-${{ runner.arch }}-xcode26.5-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'android/gradle.properties') }}

      - name: Cache Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/beid-source-packages
          key: beid-ios-spm-${{ runner.os }}-${{ runner.arch }}-xcode26.5-${{ hashFiles('ios/Beid.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Point KMP JDK resolver at setup-java
        shell: bash
        run: |
          set -euo pipefail
          printf 'KMP_JAVA_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Resolve Xcode and JDK with the iOS 26.5 runtime
        shell: bash
        run: |
          set -euo pipefail
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
          xcrun simctl list runtimes --json \
            | python3 -c 'import json, sys; runtimes = json.load(sys.stdin)["runtimes"]; raise SystemExit(0 if any(item.get("isAvailable") and item.get("name") == "iOS 26.5" for item in runtimes) else "iOS 26.5 runtime is unavailable")'

          kmp_java_home="$(scripts/resolve_kmp_java_home.sh)"
          "$kmp_java_home/bin/java" -version
          xcodebuild -version

          {
            echo "KMP_JAVA_HOME=$kmp_java_home"
            echo "JAVA_HOME=$kmp_java_home"
          } >> "$GITHUB_ENV"

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/xcodegen-pinned"
          scripts/download_xcodegen.sh "$install_dir"
          printf '%s\n' "$install_dir/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Verify XcodeGen pin and generated project
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(tr -d '[:space:]' < ios/ci_scripts/XCODEGEN_VERSION)"
          installed_version=""
          if command -v xcodegen >/dev/null 2>&1; then
            installed_version="$(xcodegen --version | awk '{print $2}')"
          fi
          if [[ "$installed_version" != "$expected_version" ]]; then
            echo "error: XcodeGen $expected_version is required; found ${installed_version:-none}" >&2
            exit 1
          fi

          echo "Using XcodeGen: $(xcodegen --version)"
          scripts/xcodegen_generate_checked.sh
          (
            cd ios
            if [[ -n "$(git status --porcelain -- Beid.xcodeproj)" ]]; then
              echo "error: Beid.xcodeproj is out of sync with project.yml" >&2
              git status --porcelain -- Beid.xcodeproj >&2
              exit 1
            fi
          )

      - name: Create owned simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(python3 scripts/ci_simulator.py \
            --name "ci-beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB")"
          printf 'udid=%s\n' "$simulator_udid" >> "$GITHUB_OUTPUT"

      - name: Verify complete test group coverage
        run: python3 scripts/ci_ios_results.py check-scheme ios/Beid.xcodeproj/xcshareddata/xcschemes/Beid.xcscheme

      - name: Build for testing
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p "$CI_OUTPUT_ROOT"
          xcodebuild \
            -project ios/Beid.xcodeproj \
            -scheme Beid \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$CI_OUTPUT_ROOT/DerivedData" \
            SWIFT_OPTIMIZATION_LEVEL=-O \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/beid-source-packages" \
            -showBuildTimingSummary \
            build-for-testing

      - name: Package test products
        run: |
          set -euo pipefail
          # tar preserves executable modes and framework symlinks.
          tar -C "$CI_OUTPUT_ROOT/DerivedData/Build" -czf "$RUNNER_TEMP/ios-test-products.tgz" Products

      - name: Upload test products
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-products
          path: ${{ runner.temp }}/ios-test-products.tgz
          compression-level: 0
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  ios-tests:
    name: iOS tests (${{ matrix.group }})
    needs: ios-simulator
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [unit, ipad, interface]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Initialize test output path
        run: printf 'CI_OUTPUT_ROOT=%s\n' "$RUNNER_TEMP/beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Create clean test simulator
        id: simulator
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
          simulator_udid="$(python3 scripts/ci_simulator.py --name "ci-beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$TEST_GROUP")"
          printf 'udid=%s\n' "$simulator_udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$simulator_udid"

      - name: Download test products
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-test-products
          path: ${{ runner.temp }}/ios-products-download

      - name: Unpack test products
        run: |
          set -euo pipefail
          mkdir -p "$CI_OUTPUT_ROOT/DerivedData/Build"
          tar -xzf "$RUNNER_TEMP/ios-products-download/ios-test-products.tgz" -C "$CI_OUTPUT_ROOT/DerivedData/Build"

      - name: Wait for test simulator readiness
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Test without rebuilding
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          TEST_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          test_runs=("$CI_OUTPUT_ROOT/DerivedData/Build/Products/"*.xctestrun)
          if [[ ${#test_runs[@]} -ne 1 ]]; then
            echo "Expected exactly one compiled test manifest" >&2
            exit 1
          fi
          selection="$(python3 scripts/ci_ios_results.py arguments "$TEST_GROUP")"
          test_args=()
          while IFS= read -r argument; do test_args+=("$argument"); done <<< "$selection"
          xcodebuild \
            -xctestrun "${test_runs[0]}" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -resultBundlePath "$CI_OUTPUT_ROOT/Tests.xcresult" \
            -parallel-testing-enabled NO \
            "${test_args[@]}" \
            test-without-building

      - name: Record structured test results
        if: always()
        env:
          TEST_GROUP: ${{ matrix.group }}
          TEST_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary --path "$CI_OUTPUT_ROOT/Tests.xcresult" --compact > "$RUNNER_TEMP/test-summary.json"
          python3 scripts/ci_ios_results.py record "$TEST_GROUP" "$RUNNER_TEMP/test-summary.json" "$RUNNER_TEMP/ios-results/$TEST_GROUP.json" "$TEST_HEAD" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload structured test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-results-${{ matrix.group }}
          path: ${{ runner.temp }}/ios-results/${{ matrix.group }}.json
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  ios-result:
    name: iOS simulator
    if: always()
    needs: [ios-simulator, ios-tests]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Require every build and test job to pass
        env:
          BUILD_RESULT: ${{ needs.ios-simulator.result }}
          TEST_RESULT: ${{ needs.ios-tests.result }}
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = success
          test "$TEST_RESULT" = success

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download every result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ios-results-*
          path: ${{ runner.temp }}/ios-results
          merge-multiple: true

      - name: Verify complete current-head evidence
        env:
          TEST_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci_ios_results.py aggregate "$RUNNER_TEMP/ios-results" "$TEST_HEAD" | tee -a "$GITHUB_STEP_SUMMARY"
