name: PR iOS CI

on:
  # Always report a status for every PR head, including drafts. Workflow-level
  # path filters would leave a required context pending on unrelated changes.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    # Measure the merged result on main exactly once. Note the concurrency
    # group below is keyed on github.ref with cancel-in-progress, so two merges
    # landing back to back cancel the earlier main run: this guarantees a run
    # starts per merge, not that every one finishes.
    branches: [main]
    paths:
      - ".github/workflows/pr-ci-ios-macos.yml"
      - "ios/**"
      - "shared/**"
      - "android/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "android/gradle.properties"
      - "android/gradlew"
      - "android/gradle/wrapper/**"
      - "scripts/resolve_kmp_java_home.sh"
      - "scripts/download_xcodegen.sh"
      - "scripts/ci_simulator.py"
  # Escape hatch: run this lane against any ref on demand. `paths` does not
  # apply to workflow_dispatch, so a manual run always executes.
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

concurrency:
  group: pr-ios-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    name: iOS simulator
    # Keep PR code on disposable hosted runners; repository variables must
    # never route a fork pull request back to a persistent signing host.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Initialize CI output path
        shell: bash
        run: |
          set -euo pipefail
          printf 'CI_OUTPUT_ROOT=%s\n' "$RUNNER_TEMP/beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # GitHub scopes PR writes to that PR; they cannot replace main caches.
          cache-read-only: false

      - name: Cache Kotlin Native dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.konan
          key: beid-ios-konan-${{ runner.os }}-${{ runner.arch }}-xcode26.5-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'android/gradle.properties') }}

      - name: Cache Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/beid-source-packages
          key: beid-ios-spm-${{ runner.os }}-${{ runner.arch }}-xcode26.5-${{ hashFiles('ios/Beid.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Point KMP JDK resolver at setup-java
        shell: bash
        run: |
          set -euo pipefail
          printf 'KMP_JAVA_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Resolve Xcode and JDK with the iOS 26.5 runtime
        shell: bash
        run: |
          set -euo pipefail
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
          xcrun simctl list runtimes --json \
            | python3 -c 'import json, sys; runtimes = json.load(sys.stdin)["runtimes"]; raise SystemExit(0 if any(item.get("isAvailable") and item.get("name") == "iOS 26.5" for item in runtimes) else "iOS 26.5 runtime is unavailable")'

          kmp_java_home="$(scripts/resolve_kmp_java_home.sh)"
          "$kmp_java_home/bin/java" -version
          xcodebuild -version

          {
            echo "KMP_JAVA_HOME=$kmp_java_home"
            echo "JAVA_HOME=$kmp_java_home"
          } >> "$GITHUB_ENV"

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/xcodegen-pinned"
          scripts/download_xcodegen.sh "$install_dir"
          printf '%s\n' "$install_dir/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Verify XcodeGen pin and generated project
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(tr -d '[:space:]' < ios/ci_scripts/XCODEGEN_VERSION)"
          installed_version=""
          if command -v xcodegen >/dev/null 2>&1; then
            installed_version="$(xcodegen --version | awk '{print $2}')"
          fi
          if [[ "$installed_version" != "$expected_version" ]]; then
            echo "error: XcodeGen $expected_version is required; found ${installed_version:-none}" >&2
            exit 1
          fi

          echo "Using XcodeGen: $(xcodegen --version)"
          scripts/xcodegen_generate_checked.sh
          (
            cd ios
            if [[ -n "$(git status --porcelain -- Beid.xcodeproj)" ]]; then
              echo "error: Beid.xcodeproj is out of sync with project.yml" >&2
              git status --porcelain -- Beid.xcodeproj >&2
              exit 1
            fi
          )

      - name: Create owned simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(python3 scripts/ci_simulator.py \
            --name "ci-beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB")"
          printf 'udid=%s\n' "$simulator_udid" >> "$GITHUB_OUTPUT"

      # A newly created device is already clean. Never erase or reuse one
      # found in the host's device list: it may belong to another job or seat.
      - name: Boot owned simulator
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIMULATOR_UDID"

      - name: Build for testing
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p "$CI_OUTPUT_ROOT"
          xcodebuild -quiet \
            -project ios/Beid.xcodeproj \
            -scheme Beid \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$CI_OUTPUT_ROOT/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/beid-source-packages" \
            build-for-testing

      - name: Wait for simulator readiness
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Test without rebuilding
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcodebuild -quiet \
            -project ios/Beid.xcodeproj \
            -scheme Beid \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$CI_OUTPUT_ROOT/DerivedData" \
            -resultBundlePath "$CI_OUTPUT_ROOT/Tests.xcresult" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/beid-source-packages" \
            test-without-building

      - name: Summarize structured test results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result_bundle="$CI_OUTPUT_ROOT/Tests.xcresult"
          summary_json="$CI_OUTPUT_ROOT/test-summary.json"

          if [[ ! -d "$result_bundle" ]]; then
            echo "### iOS simulator tests" >> "$GITHUB_STEP_SUMMARY"
            echo "Result bundle missing; tests did not produce verifiable results." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! xcrun xcresulttool get test-results summary --path "$result_bundle" --compact > "$summary_json"; then
            echo "### iOS simulator tests" >> "$GITHUB_STEP_SUMMARY"
            echo "Result bundle could not be parsed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          python3 - "$summary_json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys

          summary_path = pathlib.Path(sys.argv[1])
          job_summary_path = pathlib.Path(sys.argv[2])
          try:
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
              result = summary["result"]
              counts = {
                  "total": summary["totalTestCount"],
                  "passed": summary["passedTests"],
                  "failed": summary["failedTests"],
                  "skipped": summary["skippedTests"],
                  "expected failures": summary["expectedFailures"],
              }
              if any(isinstance(value, bool) or not isinstance(value, int) for value in counts.values()):
                  raise TypeError("test counts must be integers")
              total = counts["total"]
              passed = counts["passed"]
              failed = counts["failed"]
              skipped = counts["skipped"]
              expected_failures = counts["expected failures"]
              if any(value < 0 for value in counts.values()):
                  raise ValueError("test counts must be nonnegative")
              if any(value > total for name, value in counts.items() if name != "total"):
                  raise ValueError("a test category exceeds the total test count")
              if passed + failed + skipped + expected_failures != total:
                  raise ValueError("test categories do not account for the total test count")
          except (KeyError, TypeError, ValueError, json.JSONDecodeError) as error:
              with job_summary_path.open("a", encoding="utf-8") as output:
                  output.write("### iOS simulator tests\n\nStructured result data is corrupt or incomplete.\n")
              raise SystemExit(f"invalid xcresult summary: {error}")

          with job_summary_path.open("a", encoding="utf-8") as output:
              output.write("### iOS simulator tests\n\n")
              output.write("| Result | Total | Passed | Failed | Skipped | Expected failures |\n")
              output.write("| --- | ---: | ---: | ---: | ---: | ---: |\n")
              output.write(
                  f"| {result} | {total} | {passed} | {failed} | {skipped} | {expected_failures} |\n"
              )

          if total <= 0:
              raise SystemExit("xcresult contains zero tests")
          print(f"iOS tests: result={result}, total={total}, passed={passed}, failed={failed}, skipped={skipped}, expected_failures={expected_failures}")
          if failed != 0 or result != "Passed":
              raise SystemExit(f"tests did not pass: result={result}, failed={failed}")
          PY

      # The entire hosted VM is discarded. No shutdown/delete work is needed
      # after success or cancellation, and it must not delay the next PR head.
