name: PR iOS CI
# Display only: execution mode is selected once below from the immutable event file.
run-name: "iOS simulator (${{ github.event_name == 'pull_request' && github.event.pull_request.labels != null && !contains(github.event.pull_request.labels.*.name, 'ci:full-ui') && 'smoke' || 'full' }}) — ${{ github.event_name }} — ${{ github.ref_name }}"

on:
  # Always report a status for every PR head, including drafts. Workflow-level
  # path filters would leave a required context pending on unrelated changes.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
    types: [checks_requested]
  push:
    # Measure the merged result on main exactly once. Note the concurrency
    # group below is keyed on github.ref with cancel-in-progress, so two merges
    # landing back to back cancel the earlier main run: this guarantees a run
    # starts per merge, not that every one finishes.
    branches: [main]
    paths:
      - ".github/workflows/pr-ci-ios-macos.yml"
      - "ios/**"
      - "shared/**"
      - "android/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "android/gradle.properties"
      - "android/gradlew"
      - "android/gradle/wrapper/**"
      - "android/gradle/*.toml"
      - "scripts/ci_change_filter.py"
      - "scripts/xcodegen_generate_checked.sh"
      - "scripts/resolve_kmp_java_home.sh"
      - "scripts/download_xcodegen.sh"
      - "scripts/ci_simulator.py"
      - "scripts/ios_ui_smoke.py"
      - "scripts/ios_test_shards.py"
      - "scripts/run_local_tests.py"
  # Escape hatch: run this lane against any ref on demand. `paths` does not
  # apply to workflow_dispatch, so a manual run always executes.
  workflow_dispatch:
  # 03:23 UTC avoids the busy top of the hour; scheduled workflows use main,
  # the default branch. Its separate group cannot cancel a main push.
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

concurrency:
  # Event and ref/PR identity isolate queue entries from PR updates and main pushes.
  group: pr-ios-macos-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify paths for iOS lane
    # Pull requests only: merge groups, main pushes, nightly and manual runs bypass classification.
    # The name differs from pr-ci.yml's "Determine changed paths" on purpose:
    # required status contexts are keyed by job name.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.classify.outputs.ios }}
      error: ${{ steps.classify.outputs.error }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Collect changed paths
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const outputPath = `${process.env.RUNNER_TEMP}/beid-changed-files.json`;
            // The compare API returns at most 300 files. A list that reaches the cap
            // may be truncated, and a truncated list can look documentation-only.
            const FILE_LIMIT = 300;
            try {
              // Pinned to this event's own SHAs, never to the pull request's current
              // file list: a re-run of an older run must classify what it builds.
              let basehead;
              if (context.eventName === 'pull_request') {
                const { base, head } = context.payload.pull_request;
                basehead = `${base.sha}...${head.sha}`;
              } else if (context.eventName === 'merge_group') {
                const { base_sha, head_sha } = context.payload.merge_group || {};
                if (!/^[0-9a-f]{40}$/i.test(base_sha || '') || !/^[0-9a-f]{40}$/i.test(head_sha || '')) {
                  throw new Error('merge group is missing valid base/head SHAs');
                }
                basehead = `${base_sha}...${head_sha}`;
              } else if (context.eventName === 'push' && context.payload.before && !/^0+$/.test(context.payload.before)) {
                basehead = `${context.payload.before}...${context.payload.after}`;
              } else {
                throw new Error(`unsupported or unbounded event: ${context.eventName}`);
              }
              let listed = 0;
              let firstPage = true;
              let iosForceRun = false;
              const files = await github.paginate(
                github.rest.repos.compareCommitsWithBasehead,
                { owner: context.repo.owner, repo: context.repo.repo, basehead, per_page: 100 },
                response => {
                  // Compare pagination is by commit; files exist only on page 1.
                  if (!firstPage) return [];
                  firstPage = false;
                  const page = response.data.files;
                  if (!Array.isArray(page)) {
                    throw new Error('first compare page is missing a files array');
                  }
                  listed = page.length;
                  // Renames, deletions and incomplete metadata are never safe
                  // evidence for skipping iOS, even inside excluded directories.
                  iosForceRun ||= page.some(file =>
                    !['added', 'modified'].includes(file.status) ||
                    typeof file.filename !== 'string' || !file.filename ||
                    Boolean(file.previous_filename));
                  return page.flatMap(file => [file.filename, file.previous_filename].filter(Boolean));
                },
              );
              if (listed >= FILE_LIMIT) {
                throw new Error(`file list may be truncated at ${FILE_LIMIT} files (${listed} listed)`);
              }
              fs.writeFileSync(outputPath, JSON.stringify(iosForceRun ? { files, ios_force_run: true } : { files }), 'utf8');
            } catch (error) {
              core.warning(`changed-path collection failed; all checks will run: ${error.message}`);
              fs.writeFileSync(outputPath, JSON.stringify({ error: String(error) }), 'utf8');
            }

      - name: Classify changed paths (fail closed)
        id: classify
        if: always()
        run: python3 scripts/ci_change_filter.py --input "$RUNNER_TEMP/beid-changed-files.json" >> "$GITHUB_OUTPUT"

  ios-build:
    name: iOS simulator build
    needs: changes
    # Same fail-closed classifier condition as the former serial job.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.ios != 'false' || needs.changes.outputs.error == 'true') }}
    runs-on: macos-26
    # Hosted build including upload took 17m52s; allow setup/transfer variance.
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.test-mode.outputs.mode }}
      ui-shards: ${{ steps.plan.outputs.ui-shards }}
      unit-shards: ${{ steps.plan.outputs.unit-shards }}
    env:
      # Dedicated build-only home: no test task results enter these caches.
      GRADLE_OPTS: -Dorg.gradle.caching=true
    steps:
      - name: Initialize CI output path
        shell: bash
        run: |
          set -euo pipefail
          printf 'GRADLE_USER_HOME=%s\n' "$RUNNER_TEMP/beid-gradle" >> "$GITHUB_ENV"
          printf 'CI_OUTPUT_ROOT=%s\n' "$RUNNER_TEMP/beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-${UI_SHARD:-0}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-${UI_SHARD:-0}"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Determine test mode
        id: test-mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 -m scripts.ios_ui_smoke mode \
            --event-name "$EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Point KMP JDK resolver at setup-java
        shell: bash
        run: |
          set -euo pipefail
          printf 'KMP_JAVA_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Resolve Xcode and JDK with the iOS 26.5 runtime
        shell: bash
        run: |
          set -euo pipefail
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
          xcrun simctl list runtimes --json \
            | python3 -c 'import json, sys; runtimes = json.load(sys.stdin)["runtimes"]; raise SystemExit(0 if any(item.get("isAvailable") and item.get("name") == "iOS 26.5" for item in runtimes) else "iOS 26.5 runtime is unavailable")'

          kmp_java_home="$(scripts/resolve_kmp_java_home.sh)"
          "$kmp_java_home/bin/java" -version
          xcodebuild -version

          {
            echo "KMP_JAVA_HOME=$kmp_java_home"
            echo "JAVA_HOME=$kmp_java_home"
          } >> "$GITHUB_ENV"

      - name: Identify cache inputs
        id: cache-inputs
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(
            {
              xcodebuild -version
              xcrun --sdk iphonesimulator --show-sdk-build-version
              "$JAVA_HOME/bin/java" -version 2>&1
              sw_vers -buildVersion
            } | shasum -a 256 | awk '{print $1}'
          )"
          printf 'toolchain=%s\n' "$toolchain" >> "$GITHUB_OUTPUT"
          printf 'source-tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies cache
        id: dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/beid-gradle/wrapper/dists
            ${{ runner.temp }}/beid-gradle/caches/modules-2
            ~/.konan
          key: beid-ios-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.toolchain }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.*', '**/gradlew*', '**/*.toml', 'scripts/resolve_kmp_java_home.sh', '.github/workflows/pr-ci-ios-macos.yml') }}
          restore-keys: |
            beid-ios-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.toolchain }}-

      - name: Restore swift-packages cache
        id: swift-packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/beid-swift-packages
          key: beid-ios-swift-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.toolchain }}-${{ hashFiles('**/Package.resolved', '**/Package.swift', 'ios/project.yml', 'ios/Beid.xcodeproj/project.pbxproj', '.github/workflows/pr-ci-ios-macos.yml') }}

      - name: Restore gradle-build cache
        id: gradle-build
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/beid-gradle/caches/build-cache-1
          key: beid-ios-gradle-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.toolchain }}-${{ steps.cache-inputs.outputs.source-tree }}
          restore-keys: |
            beid-ios-gradle-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-inputs.outputs.toolchain }}-

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/xcodegen-pinned"
          scripts/download_xcodegen.sh "$install_dir"
          printf '%s\n' "$install_dir/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Verify XcodeGen pin and generated project
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(tr -d '[:space:]' < ios/ci_scripts/XCODEGEN_VERSION)"
          installed_version=""
          if command -v xcodegen >/dev/null 2>&1; then
            installed_version="$(xcodegen --version | awk '{print $2}')"
          fi
          if [[ "$installed_version" != "$expected_version" ]]; then
            echo "error: XcodeGen $expected_version is required; found ${installed_version:-none}" >&2
            exit 1
          fi

          echo "Using XcodeGen: $(xcodegen --version)"
          scripts/xcodegen_generate_checked.sh
          (
            cd ios
            if [[ -n "$(git status --porcelain -- Beid.xcodeproj)" ]]; then
              echo "error: Beid.xcodeproj is out of sync with project.yml" >&2
              git status --porcelain -- Beid.xcodeproj >&2
              exit 1
            fi
          )

      - name: Resolve pinned Swift packages
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project ios/Beid.xcodeproj -scheme Beid \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/beid-swift-packages" \
            -onlyUsePackageVersionsFromResolvedFile
          git diff --exit-code -- ios/Beid.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Create owned simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(python3 scripts/ci_simulator.py \
            --name "ci-beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-${UI_SHARD:-0}")"
          printf 'udid=%s\n' "$simulator_udid" >> "$GITHUB_OUTPUT"

      # A newly created device is already clean. Never erase or reuse one
      # found in the host's device list: it may belong to another job or seat.

      - name: Boot owned simulator
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Build for testing
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p "$CI_OUTPUT_ROOT"
          xcodebuild -hideShellScriptEnvironment -showBuildTimingSummary \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/beid-swift-packages" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -project ios/Beid.xcodeproj \
            -scheme Beid \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$CI_OUTPUT_ROOT/DerivedData" \
            SWIFT_OPTIMIZATION_LEVEL=-O \
            build-for-testing

      - name: Enumerate built tests and plan shards
        id: plan
        shell: bash
        env:
          TEST_MODE: ${{ steps.test-mode.outputs.mode }}
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          runs=("$CI_OUTPUT_ROOT/DerivedData/Build/Products/"*.xctestrun)
          test "${#runs[@]}" -eq 1
          xcodebuild -quiet test-without-building -xctestrun "${runs[0]}" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:BeidUITests -enumerate-tests \
            -test-enumeration-style flat -test-enumeration-format text \
            -test-enumeration-output-path "$CI_OUTPUT_ROOT/ui-enumeration.txt"
          xcodebuild -quiet test-without-building -xctestrun "${runs[0]}" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:BeidTests -enumerate-tests \
            -test-enumeration-style flat -test-enumeration-format text \
            -test-enumeration-output-path "$CI_OUTPUT_ROOT/unit-enumeration.txt"
          python3 -m scripts.ios_test_shards plan --mode "$TEST_MODE" \
            --enumeration "$CI_OUTPUT_ROOT/ui-enumeration.txt" \
            --unit-enumeration "$CI_OUTPUT_ROOT/unit-enumeration.txt" \
            --unit-durations ios/ci/unit-test-durations.tsv \
            --durations ios/ci/ui-test-durations.tsv --output "$CI_OUTPUT_ROOT/plan" >> "$GITHUB_OUTPUT"

      - name: Pack portable test products and report size
        shell: bash
        env:
          TEST_MODE: ${{ steps.test-mode.outputs.mode }}
        run: |
          set -euo pipefail
          python3 -m scripts.ios_test_shards pack \
            --products "$CI_OUTPUT_ROOT/DerivedData/Build/Products" \
            --archive "$CI_OUTPUT_ROOT/products.tar.gz" > "$CI_OUTPUT_ROOT/artifact-size.txt"
          cat "$CI_OUTPUT_ROOT/artifact-size.txt"
          {
            printf 'Mode: %s. Build only; tests execute in downstream jobs.\n' "$TEST_MODE"
            cat "$CI_OUTPUT_ROOT/artifact-size.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test products
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-products
          overwrite: true
          path: ${{ env.CI_OUTPUT_ROOT }}/products.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Upload shard plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-plan
          overwrite: true
          path: ${{ env.CI_OUTPUT_ROOT }}/plan/
          if-no-files-found: error
          retention-days: 7

      # Restore has no implicit post-job save. Fork PRs can read base caches,
      # but never write; PR caches are scoped to their merge ref by GitHub.
      # Save only after build, enumeration and handoff all succeed, never tests.
      - name: Save dependencies cache
        if: ${{ success() && steps.dependencies.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
          path: |
            ${{ runner.temp }}/beid-gradle/wrapper/dists
            ${{ runner.temp }}/beid-gradle/caches/modules-2
            ~/.konan

      - name: Save swift-packages cache
        if: ${{ success() && steps.swift-packages.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.swift-packages.outputs.cache-primary-key }}
          path: |
            ${{ runner.temp }}/beid-swift-packages

      # Gradle expires unused entries by age, not total size. Bound each saved
      # directory even when prefix restores accumulate recently used outputs.
      - name: Check gradle-build cache size
        id: gradle-cache-size
        if: ${{ success() && steps.gradle-build.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$GRADLE_USER_HOME/caches/build-cache-1"
          size_kib=0
          if [[ -d "$cache_dir" ]]; then
            size_kib="$(du -sk "$cache_dir" | awk '{print $1}')"
          fi
          within_limit=false
          if [[ "$size_kib" -gt 0 && "$size_kib" -le 524288 ]]; then
            within_limit=true
          fi
          printf 'within-limit=%s\n' "$within_limit" >> "$GITHUB_OUTPUT"
          printf 'Gradle build cache: %s KiB; save limit 524288 KiB (512 MiB); eligible=%s.\n' \
            "$size_kib" "$within_limit" >> "$GITHUB_STEP_SUMMARY"

      - name: Save gradle-build cache
        if: ${{ success() && steps.gradle-build.outputs.cache-hit != 'true' && steps.gradle-cache-size.outputs.within-limit == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.gradle-build.outputs.cache-primary-key }}
          path: |
            ${{ runner.temp }}/beid-gradle/caches/build-cache-1

      - name: Delete owned simulator
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl delete "$SIMULATOR_UDID"

  ios-unit:
    name: iOS unit shard ${{ matrix.shard }}
    needs: ios-build
    runs-on: macos-26
    # Each class-level shard owns a fresh simulator; retain the 30-minute limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.ios-build.outputs.unit-shards) }}
    env:
      TEST_MODE: ${{ needs.ios-build.outputs.mode }}
      TEST_BUNDLE: BeidTests
      EVIDENCE_JOB: unit-${{ matrix.shard }}
      UNIT_SHARD: ${{ matrix.shard }}
    steps:
      - name: Initialize CI output path
        shell: bash
        run: |
          set -euo pipefail
          printf 'CI_OUTPUT_ROOT=%s\n' "$RUNNER_TEMP/beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-${UNIT_SHARD:-0}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-${UNIT_SHARD:-0}"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check selected Xcode and runtime
        shell: bash
        run: |
          set -euo pipefail
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
          xcrun simctl list runtimes --json \
            | python3 -c 'import json, sys; runtimes = json.load(sys.stdin)["runtimes"]; raise SystemExit(0 if any(item.get("isAvailable") and item.get("name") == "iOS 26.5" for item in runtimes) else "iOS 26.5 runtime is unavailable")'

      - name: Download test products
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-products
          path: ${{ env.CI_OUTPUT_ROOT }}

      - name: Download shard plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-plan
          path: ${{ env.CI_OUTPUT_ROOT }}/plan

      - name: Extract test products
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$CI_OUTPUT_ROOT/products.tar.gz" -C "$CI_OUTPUT_ROOT"

      - name: Create owned simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(python3 scripts/ci_simulator.py \
            --name "ci-beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-${UNIT_SHARD:-0}")"
          printf 'udid=%s\n' "$simulator_udid" >> "$GITHUB_OUTPUT"

      # A newly created device is already clean. Never erase or reuse one
      # found in the host's device list: it may belong to another job or seat.

      - name: Boot owned simulator
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Test without rebuilding
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          runs=("$CI_OUTPUT_ROOT/Products/"*.xctestrun)
          test "${#runs[@]}" -eq 1
          test_args=(SWIFT_OPTIMIZATION_LEVEL=-O)
          test -s "$CI_OUTPUT_ROOT/plan/unit-$UNIT_SHARD.txt"
          while IFS= read -r identifier; do
            test_args+=("-only-testing:$identifier")
          done < "$CI_OUTPUT_ROOT/plan/unit-$UNIT_SHARD.txt"
          xcodebuild -quiet \
            -xctestrun "${runs[0]}" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$CI_OUTPUT_ROOT/Tests.xcresult" \
            "${test_args[@]}" \
            test-without-building

      - name: Summarize structured test results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CI_OUTPUT_ROOT/evidence"
          xcrun xcresulttool get test-results summary \
            --path "$CI_OUTPUT_ROOT/Tests.xcresult" --compact > "$CI_OUTPUT_ROOT/evidence/test-summary.json"
          xcrun xcresulttool get test-results tests --schema \
            --path "$CI_OUTPUT_ROOT/Tests.xcresult" > "$CI_OUTPUT_ROOT/evidence/test-tree-schema.json"
          xcrun xcresulttool get test-results tests \
            --path "$CI_OUTPUT_ROOT/Tests.xcresult" --compact > "$CI_OUTPUT_ROOT/evidence/test-tree.json"
          python3 -m scripts.ios_test_shards report --mode "$TEST_MODE" \
            --bundle "$TEST_BUNDLE" --job "$EVIDENCE_JOB" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --root "$CI_OUTPUT_ROOT/evidence" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload executed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-evidence-${{ env.EVIDENCE_JOB }}
          overwrite: true
          path: ${{ env.CI_OUTPUT_ROOT }}/evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Delete owned simulator
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl delete "$SIMULATOR_UDID"

  ios-ui:
    name: iOS UI shard ${{ matrix.shard }}
    needs: ios-build
    runs-on: macos-26
    # Measured-duration shards; retain allowance for hosted setup/transfer variance.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.ios-build.outputs.ui-shards) }}
    env:
      TEST_MODE: ${{ needs.ios-build.outputs.mode }}
      TEST_BUNDLE: BeidUITests
      EVIDENCE_JOB: ui-${{ matrix.shard }}
      UI_SHARD: ${{ matrix.shard }}
    steps:
      - name: Initialize CI output path
        shell: bash
        run: |
          set -euo pipefail
          printf 'CI_OUTPUT_ROOT=%s\n' "$RUNNER_TEMP/beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-${UI_SHARD:-0}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-${UI_SHARD:-0}"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check selected Xcode and runtime
        shell: bash
        run: |
          set -euo pipefail
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
          xcrun simctl list runtimes --json \
            | python3 -c 'import json, sys; runtimes = json.load(sys.stdin)["runtimes"]; raise SystemExit(0 if any(item.get("isAvailable") and item.get("name") == "iOS 26.5" for item in runtimes) else "iOS 26.5 runtime is unavailable")'

      - name: Download test products
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-products
          path: ${{ env.CI_OUTPUT_ROOT }}

      - name: Download shard plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-plan
          path: ${{ env.CI_OUTPUT_ROOT }}/plan

      - name: Extract test products
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$CI_OUTPUT_ROOT/products.tar.gz" -C "$CI_OUTPUT_ROOT"

      - name: Create owned simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(python3 scripts/ci_simulator.py \
            --name "ci-beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-${UI_SHARD:-0}")"
          printf 'udid=%s\n' "$simulator_udid" >> "$GITHUB_OUTPUT"

      # A newly created device is already clean. Never erase or reuse one
      # found in the host's device list: it may belong to another job or seat.

      - name: Boot owned simulator
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Test without rebuilding
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          runs=("$CI_OUTPUT_ROOT/Products/"*.xctestrun)
          test "${#runs[@]}" -eq 1
          test_args=(SWIFT_OPTIMIZATION_LEVEL=-O)
          test -s "$CI_OUTPUT_ROOT/plan/ui-$UI_SHARD.txt"
          while IFS= read -r identifier; do
            test_args+=("-only-testing:$identifier")
          done < "$CI_OUTPUT_ROOT/plan/ui-$UI_SHARD.txt"
          xcodebuild -quiet \
            -xctestrun "${runs[0]}" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$CI_OUTPUT_ROOT/Tests.xcresult" \
            "${test_args[@]}" \
            test-without-building

      - name: Summarize structured test results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CI_OUTPUT_ROOT/evidence"
          xcrun xcresulttool get test-results summary \
            --path "$CI_OUTPUT_ROOT/Tests.xcresult" --compact > "$CI_OUTPUT_ROOT/evidence/test-summary.json"
          xcrun xcresulttool get test-results tests --schema \
            --path "$CI_OUTPUT_ROOT/Tests.xcresult" > "$CI_OUTPUT_ROOT/evidence/test-tree-schema.json"
          xcrun xcresulttool get test-results tests \
            --path "$CI_OUTPUT_ROOT/Tests.xcresult" --compact > "$CI_OUTPUT_ROOT/evidence/test-tree.json"
          python3 -m scripts.ios_test_shards report --mode "$TEST_MODE" \
            --bundle "$TEST_BUNDLE" --job "$EVIDENCE_JOB" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --root "$CI_OUTPUT_ROOT/evidence" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload executed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-evidence-${{ env.EVIDENCE_JOB }}
          overwrite: true
          path: ${{ env.CI_OUTPUT_ROOT }}/evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Delete owned simulator
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl delete "$SIMULATOR_UDID"

  ios-simulator:
    name: iOS simulator
    needs: [changes, ios-build, ios-unit, ios-ui]
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      TEST_MODE: ${{ needs.ios-build.outputs.mode }}
      EVENT_NAME: ${{ github.event_name }}
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Initialize CI output path
        shell: bash
        run: |
          set -euo pipefail
          printf 'CI_OUTPUT_ROOT=%s\n' "$RUNNER_TEMP/beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-${UI_SHARD:-0}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-${UI_SHARD:-0}"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # A successful classifier's explicit false is the ONLY skip exception.
      - name: Download aggregate plan
        if: ${{ github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.ios != 'false' || needs.changes.outputs.error == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-plan
          path: ${{ env.CI_OUTPUT_ROOT }}/plan

      - name: Download every job evidence
        if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.ios != 'false' || needs.changes.outputs.error == 'true') }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ios-evidence-*
          path: ${{ env.CI_OUTPUT_ROOT }}/evidence

      - name: Verify all jobs and test unions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON" > "$CI_OUTPUT_ROOT/needs.json"
          python3 -m scripts.ios_test_shards aggregate --event "$EVENT_NAME" \
            --needs "$CI_OUTPUT_ROOT/needs.json" --mode "$TEST_MODE" \
            --root "$CI_OUTPUT_ROOT" --summary "$GITHUB_STEP_SUMMARY"
