name: PR iOS CI
# Execution mode is selected below from the event and its changed paths.
run-name: "iOS simulator (${{ github.event_name == 'pull_request' && github.event.pull_request.labels != null && !contains(github.event.pull_request.labels.*.name, 'ci:full-ui') && 'auto' || 'full' }}) — ${{ github.event_name }} — ${{ github.ref_name }}"

on:
  # Always report a status for every PR head, including drafts. Workflow-level
  # path filters would leave a required context pending on unrelated changes.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, closed]
  merge_group:
    types: [checks_requested]
  push:
    # Report on matching main pushes. The planner can credit a directly executed
    # full main merge-queue run on the identical commit.
    branches: [main]
    paths:
      - ".github/workflows/pr-ci-ios-macos.yml"
      - "ios/**"
      - "shared/**"
      - "android/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "android/gradle.properties"
      - "android/gradlew"
      - "android/gradle/wrapper/**"
      - "android/gradle/*.toml"
      - "scripts/ci_change_filter.py"
      - "scripts/ios_pr_run_reuse.py"
      - "scripts/xcodegen_generate_checked.sh"
      - "scripts/resolve_kmp_java_home.sh"
      - "scripts/download_xcodegen.sh"
      - "scripts/ci_simulator.py"
      - "scripts/ios_ui_smoke.py"
      - "scripts/ios_ci_timing.py"
      - "scripts/ios_ci_products.py"
      - "scripts/ios-ui-durations.json"
      - "scripts/ios-ui-iphone-skips.txt"
      - "scripts/run_local_tests.py"
  # Escape hatch: run this lane against any ref on demand. `paths` does not
  # apply to workflow_dispatch, so a manual run always executes.
  workflow_dispatch:
    inputs:
      ui_shards:
        description: Number of UI test jobs for this full run
        type: choice
        options: ['4', '5']
  # 03:23 UTC avoids the busy top of the hour; scheduled workflows use main,
  # the default branch. Its separate group cannot cancel a main push.
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  # Four UI jobs plus the unit job fit within five available macOS slots.
  IOS_UI_SHARDS: ${{ inputs.ui_shards || '4' }}

concurrency:
  # A merged PR's ref changes to its base. Keep close in the PR's group;
  # an unrelated label gets its own group so it cannot cancel active tests.
  group: pr-ios-macos-${{ github.event_name }}-${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.number) || github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'ci:full-ui' || github.event.action == 'closed' && github.run_attempt > 1) && github.run_id || '' }}
  cancel-in-progress: ${{ github.event.action != 'ready_for_review' }}

jobs:
  changes:
    name: Classify paths for iOS lane
    # Pull requests only: merge groups, main pushes, nightly and manual runs bypass classification.
    # The name differs from pr-ci.yml's "Determine changed paths" on purpose:
    # required status contexts are keyed by job name.
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && (github.event.action != 'labeled' || github.event.label.name == 'ci:full-ui') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.classify.outputs.ios }}
      ios_full: ${{ steps.classify.outputs.ios_full }}
      error: ${{ steps.classify.outputs.error }}
      shadow_paths: ${{ steps.shadow_paths.outputs.json }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Collect changed paths
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const outputPath = `${process.env.RUNNER_TEMP}/beid-changed-files.json`;
            // The compare API returns at most 300 files. A list that reaches the cap
            // may be truncated, and a truncated list can look documentation-only.
            const FILE_LIMIT = 300;
            try {
              // Pinned to this event's own SHAs, never to the pull request's current
              // file list: a re-run of an older run must classify what it builds.
              let basehead;
              if (context.eventName === 'pull_request') {
                const { base, head } = context.payload.pull_request;
                basehead = `${base.sha}...${head.sha}`;
              } else if (context.eventName === 'merge_group') {
                const { base_sha, head_sha } = context.payload.merge_group || {};
                if (!/^[0-9a-f]{40}$/i.test(base_sha || '') || !/^[0-9a-f]{40}$/i.test(head_sha || '')) {
                  throw new Error('merge group is missing valid base/head SHAs');
                }
                basehead = `${base_sha}...${head_sha}`;
              } else if (context.eventName === 'push' && context.payload.before && !/^0+$/.test(context.payload.before)) {
                basehead = `${context.payload.before}...${context.payload.after}`;
              } else {
                throw new Error(`unsupported or unbounded event: ${context.eventName}`);
              }
              let listed = 0;
              let firstPage = true;
              let iosForceRun = false;
              const files = await github.paginate(
                github.rest.repos.compareCommitsWithBasehead,
                { owner: context.repo.owner, repo: context.repo.repo, basehead, per_page: 100 },
                response => {
                  // Compare pagination is by commit; files exist only on page 1.
                  if (!firstPage) return [];
                  firstPage = false;
                  const page = response.data.files;
                  if (!Array.isArray(page)) {
                    throw new Error('first compare page is missing a files array');
                  }
                  listed = page.length;
                  // Renames, deletions and incomplete metadata are never safe
                  // evidence for skipping iOS, even inside excluded directories.
                  iosForceRun ||= page.some(file =>
                    !['added', 'modified'].includes(file.status) ||
                    typeof file.filename !== 'string' || !file.filename ||
                    Boolean(file.previous_filename));
                  return page.flatMap(file => [file.filename, file.previous_filename].filter(Boolean));
                },
              );
              if (listed >= FILE_LIMIT) {
                throw new Error(`file list may be truncated at ${FILE_LIMIT} files (${listed} listed)`);
              }
              fs.writeFileSync(outputPath, JSON.stringify(iosForceRun ? { files, ios_force_run: true } : { files }), 'utf8');
            } catch (error) {
              core.warning(`changed-path collection failed; all checks will run: ${error.message}`);
              fs.writeFileSync(outputPath, JSON.stringify({ error: String(error) }), 'utf8');
            }

      - name: Classify changed paths (fail closed)
        id: classify
        if: always()
        run: python3 scripts/ci_change_filter.py --input "$RUNNER_TEMP/beid-changed-files.json" >> "$GITHUB_OUTPUT"

      # The collector writes compact single-line JSON. Missing or oversized
      # inputs leave the advisory comparison on its conservative full default.
      - name: Export paths for UI selection comparison
        id: shadow_paths
        shell: bash
        run: |
          file="$RUNNER_TEMP/beid-changed-files.json"
          if [[ -f "$file" ]] && (( $(wc -c < "$file") <= 16384 )); then
            printf 'json=%s\n' "$(cat "$file")" >> "$GITHUB_OUTPUT"
          fi

  plan:
    name: Plan iOS test jobs
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'skipped') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      mode: ${{ steps.test-mode.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
      previous: ${{ steps.previous.outputs.previous }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Determine test mode
        id: test-mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ALLOW_SMOKE: ${{ needs.changes.result == 'success' && needs.changes.outputs.error == 'false' && needs.changes.outputs.ios_full == 'false' }}
        run: |
          set -euo pipefail
          if [[ "$ALLOW_SMOKE" != true ]]; then
            printf 'mode=full\n' >> "$GITHUB_OUTPUT"
          else
            python3 -m scripts.ios_ui_smoke mode \
              --event-name "$EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for directly executed iOS evidence
        id: previous
        if: >-
          ${{ github.run_attempt == 1 &&
              ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
               (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
                (github.event.action == 'ready_for_review' || github.event.action == 'synchronize' && !contains(github.event.pull_request.labels.*.name, 'ci:full-ui')) &&
                needs.changes.result == 'success' && needs.changes.outputs.ios == 'true' && needs.changes.outputs.error == 'false')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.test-mode.outputs.mode }}
        run: |
          if [[ -f scripts/ios_pr_run_reuse.py ]]; then
            python3 -m scripts.ios_pr_run_reuse "$MODE" >> "$GITHUB_OUTPUT"
          fi

      # This step name records immutable event inputs on the source attempt.
      - name: iOS plan v2 PR ${{ github.event.number }} base ${{ github.event.pull_request.base.sha }} head ${{ github.event.pull_request.head.sha }} mode ${{ steps.test-mode.outputs.mode }} merge ${{ github.sha }}
        if: ${{ github.event_name == 'pull_request' && !steps.previous.outputs.previous && needs.changes.outputs.ios == 'true' && needs.changes.outputs.error == 'false' }}
        run: echo "Planning a fresh iOS execution"

      - name: Use prior iOS execution
        if: ${{ steps.previous.outputs.previous != '' }}
        run: echo "The aggregate will identify the original run and tested SHA."

      - name: Plan bounded test matrix
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_JSON: ${{ toJSON(needs.changes) }}
          PREVIOUS: ${{ steps.previous.outputs.previous }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from scripts.ios_ui_smoke import classifier_skip
          count = int(os.environ['IOS_UI_SHARDS'])
          if count not in (4, 5):
              raise SystemExit('IOS_UI_SHARDS must be 4 or 5')
          skip = classifier_skip(os.environ['EVENT_NAME'], {'changes': json.loads(os.environ['CHANGES_JSON'])})
          print(f'run={str(not skip and not os.environ.get("PREVIOUS")).lower()}')
          print('matrix=' + json.dumps({'lane': ['unit'] + [f'ui-{i + 1}' for i in range(count)]}))
          PY

  build:
    name: Build iOS test bundles
    needs: [changes, plan]
    permissions:
      contents: read
      actions: read
    # A failed/missing classifier runs the lane. Smoke builds and tests here;
    # full builds once here, then runs the artifact on independent test jobs.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run == 'true' }}
    # Keep PR code on disposable hosted runners; repository variables must
    # never route a fork pull request back to a persistent signing host.
    runs-on: xcode-27
    # The former serial full job hit 60 minutes. Full mode now builds once
    # and fans out to at most six macOS test jobs. Smoke retains its single job.
    # 50 minutes is containment for build/smoke, not a performance target.
    timeout-minutes: 50
    outputs:
      # Retried shards may depend on a build from an earlier run attempt.
      products_artifact_name: ${{ steps.package.outputs.artifact_name }}
      evidence_attempt: ${{ steps.initialize.outputs.attempt }}
    steps:
      - name: Initialize CI output path
        id: initialize
        env:
          RELEASE_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'release/1.1.0' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          output="$RUNNER_TEMP/beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ "$RELEASE_PR" == true ]]; then
            output="$RUNNER_TEMP/beid-release-build"
          fi
          printf 'CI_OUTPUT_ROOT=%s\n' "$output" >> "$GITHUB_ENV"
          # Stable dependency-only location; never cache DerivedData/results.
          printf 'SPM_SOURCE_ROOT=%s\n' "$RUNNER_TEMP/beid-spm/SourcePackages" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Point KMP JDK resolver at setup-java
        shell: bash
        run: |
          set -euo pipefail
          printf 'KMP_JAVA_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Resolve Xcode and JDK with the iOS 27.0 runtime
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 27.2"
          xcrun simctl list runtimes --json \
            | python3 -c 'import json, sys; runtimes = json.load(sys.stdin)["runtimes"]; raise SystemExit(0 if any(item.get("isAvailable") and item.get("name") == "iOS 27.0" for item in runtimes) else "iOS 27.0 runtime is unavailable")'

          kmp_java_home="$(scripts/resolve_kmp_java_home.sh)"
          "$kmp_java_home/bin/java" -version
          xcodebuild -version

          {
            echo "KMP_JAVA_HOME=$kmp_java_home"
            echo "JAVA_HOME=$kmp_java_home"
          } >> "$GITHUB_ENV"
          {
            printf 'xcode=%s\n' "$(xcodebuild -version | shasum -a 256 | awk '{print $1}')"
            printf 'sdk=%s\n' "$(xcrun --sdk iphonesimulator --show-sdk-build-version)"
            printf 'jdk=%s\n' "$("$kmp_java_home/bin/java" -version 2>&1 | shasum -a 256 | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      # The checked-in wrapper verifies the distribution SHA on download.
      # Its distribution survives unrelated Xcode, SDK and KMP cache misses.
      - name: Restore Gradle distribution
        id: distribution
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.gradle/wrapper/dists
          key: beid-ios-gradle-dist-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/wrapper/gradle-wrapper.jar') }}

      - name: Prepare Gradle distribution
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          # Retry a cold download once before spending time on the simulator.
          ./gradlew --version || ./gradlew --version

      - name: Save Gradle distribution
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'release/1.1.0') && steps.distribution.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ steps.distribution.outputs.cache-primary-key }}

      - name: Cache KMP dependencies
        id: kmp
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches/modules-2/files-2.1
            ~/.konan/dependencies
          # The Kotlin version is declared in android/build.gradle.kts today.
          # No prefix restore: a toolchain/configuration mismatch stays cold.
          key: beid-ios-kmp-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ steps.toolchain.outputs.sdk }}-${{ steps.toolchain.outputs.jdk }}-${{ hashFiles('android/gradle/*.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle.kts', 'android/settings.gradle.kts', 'android/gradle.properties', 'shared/build.gradle.kts') }}

      - name: Cache SPM checkouts
        id: spm
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Repository objects keep checkouts' Git alternates valid. Neither
          # SwiftPM build products nor DerivedData are included.
          path: |
            ${{ env.SPM_SOURCE_ROOT }}/checkouts
            ${{ env.SPM_SOURCE_ROOT }}/repositories
          key: beid-ios-spm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('ios/Beid.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Restore release compiler and Kotlin export caches
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'release/1.1.0'
        uses: ./.github/actions/ios-release-cache
        with:
          operation: restore

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/xcodegen-pinned"
          scripts/download_xcodegen.sh "$install_dir"
          printf '%s\n' "$install_dir/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Verify XcodeGen pin and generated project
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(tr -d '[:space:]' < ios/ci_scripts/XCODEGEN_VERSION)"
          installed_version=""
          if command -v xcodegen >/dev/null 2>&1; then
            installed_version="$(xcodegen --version | awk '{print $2}')"
          fi
          if [[ "$installed_version" != "$expected_version" ]]; then
            echo "error: XcodeGen $expected_version is required; found ${installed_version:-none}" >&2
            exit 1
          fi

          echo "Using XcodeGen: $(xcodegen --version)"
          scripts/xcodegen_generate_checked.sh
          (
            cd ios
            if [[ -n "$(git status --porcelain -- Beid.xcodeproj Lab/Info.plist)" ]]; then
              echo "error: Beid.xcodeproj or Lab/Info.plist is out of sync with project.yml" >&2
              git status --porcelain -- Beid.xcodeproj Lab/Info.plist >&2
              exit 1
            fi
          )

      - name: Create owned simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(python3 scripts/ci_simulator.py \
            --name "ci-beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB")"
          printf 'udid=%s\n' "$simulator_udid" >> "$GITHUB_OUTPUT"

      # A newly created device is already clean. Never erase or reuse one
      # found in the host's device list: it may belong to another job or seat.
      - name: Boot owned simulator
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Build for testing
        # Release Kotlin takes about 12 minutes on xcode-27 (Debug: about 7).
        timeout-minutes: 35
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p "$CI_OUTPUT_ROOT"
          python3 -m scripts.ios_ci_timing --phase spm \
            --log "$CI_OUTPUT_ROOT/spm.log" --timings "$CI_OUTPUT_ROOT/build-timings.jsonl" -- \
            xcodebuild -resolvePackageDependencies -project ios/Beid.xcodeproj -scheme Beid \
            -clonedSourcePackagesDirPath "$SPM_SOURCE_ROOT" -onlyUsePackageVersionsFromResolvedFile
          cache_flags=("GITHUB_ACTIONS=${GITHUB_ACTIONS:-}" "RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-}"
                       "BEID_SWIFT_EXPORT_KEY=${BEID_SWIFT_EXPORT_KEY:-}"
                       "BEID_SWIFT_EXPORT_ENTRY=${BEID_SWIFT_EXPORT_ENTRY:-}")
          if [[ -n "${BEID_CAS_PATH:-}" ]]; then
            cache_flags+=(COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES
                            "COMPILATION_CACHE_CAS_PATH=$BEID_CAS_PATH")
          fi
          python3 -m scripts.ios_ci_timing --phase build \
            --log "$CI_OUTPUT_ROOT/build.log" --timings "$CI_OUTPUT_ROOT/build-timings.jsonl" -- \
            xcodebuild -showBuildTimingSummary \
            -project ios/Beid.xcodeproj \
            -scheme Beid \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$CI_OUTPUT_ROOT/DerivedData" \
            -clonedSourcePackagesDirPath "$SPM_SOURCE_ROOT" \
            -disableAutomaticPackageResolution \
            SWIFT_OPTIMIZATION_LEVEL=-O \
            "${cache_flags[@]}" \
            BEID_KMP_BUILD_TYPE=Release \
            build-for-testing

      - name: Enumerate built tests and compute shards
        id: enumerate
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          TEST_MODE: ${{ needs.plan.outputs.mode }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          xctestrun="$(python3 -c 'import os; from pathlib import Path; from scripts.ios_ci_products import test_run; print(test_run(Path(os.environ["CI_OUTPUT_ROOT"]) / "DerivedData"))')"
          printf 'xctestrun=%s\n' "$xctestrun" >> "$GITHUB_OUTPUT"
          xcodebuild -quiet test-without-building -xctestrun "$xctestrun" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -enumerate-tests -test-enumeration-style hierarchical -test-enumeration-format json \
            -test-enumeration-output-path "$CI_OUTPUT_ROOT/enumerated-tests.json"
          python3 -m scripts.ios_ui_smoke shards --mode "$TEST_MODE" \
            --enumeration "$CI_OUTPUT_ROOT/enumerated-tests.json" --count "$IOS_UI_SHARDS" \
            --sha "$EXPECTED_SHA" --output "$CI_OUTPUT_ROOT/manifest.json"

      - name: Package full-mode test products
        id: package
        if: ${{ needs.plan.outputs.mode == 'full' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -m scripts.ios_ci_products pack --derived-data "$CI_OUTPUT_ROOT/DerivedData" \
            --manifest "$CI_OUTPUT_ROOT/manifest.json" --archive "$CI_OUTPUT_ROOT/products.tar" \
            --sha "$EXPECTED_SHA" --xcode "$(xcodebuild -version)" \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-version)" --arch "$(uname -m)"
          printf 'artifact_name=ios-products-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload full-mode test products
        if: ${{ needs.plan.outputs.mode == 'full' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ env.CI_OUTPUT_ROOT }}/products.tar
          compression-level: 1
          if-no-files-found: error
          retention-days: 3

      - name: Test without rebuilding
        if: ${{ needs.plan.outputs.mode == 'smoke' }}
        timeout-minutes: 10
        shell: bash
        env:
          TEST_MODE: ${{ needs.plan.outputs.mode }}
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          XCTESTRUN: ${{ steps.enumerate.outputs.xctestrun }}
        run: |
          set -euo pipefail
          # Materialize before reading: a parser failure must stop the test step.
          python3 -m scripts.ios_ui_smoke arguments --mode "$TEST_MODE" \
            > "$CI_OUTPUT_ROOT/test-arguments.txt"
          test_args=(SWIFT_OPTIMIZATION_LEVEL=-O)
          while IFS= read -r argument; do
            test_args+=("$argument")
          done < "$CI_OUTPUT_ROOT/test-arguments.txt"
          xcodebuild -quiet \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$CI_OUTPUT_ROOT/DerivedData" \
            -resultBundlePath "$CI_OUTPUT_ROOT/Tests.xcresult" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            "${test_args[@]}" \
            test-without-building

      - name: Summarize structured test results
        if: ${{ always() && needs.plan.outputs.mode == 'smoke' }}
        shell: bash
        run: |
          set -euo pipefail
          result_bundle="$CI_OUTPUT_ROOT/Tests.xcresult"
          summary_json="$CI_OUTPUT_ROOT/test-summary.json"

          if [[ ! -d "$result_bundle" ]]; then
            echo "### iOS simulator tests" >> "$GITHUB_STEP_SUMMARY"
            echo "Result bundle missing; tests did not produce verifiable results." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! xcrun xcresulttool get test-results summary --path "$result_bundle" --compact > "$summary_json"; then
            echo "### iOS simulator tests" >> "$GITHUB_STEP_SUMMARY"
            echo "Result bundle could not be parsed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          python3 - "$summary_json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys
          import uuid

          summary_path = pathlib.Path(sys.argv[1])
          job_summary_path = pathlib.Path(sys.argv[2])
          try:
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
              result = summary["result"]
              counts = {
                  "total": summary["totalTestCount"],
                  "passed": summary["passedTests"],
                  "failed": summary["failedTests"],
                  "skipped": summary["skippedTests"],
                  "expected failures": summary["expectedFailures"],
              }
              if any(isinstance(value, bool) or not isinstance(value, int) for value in counts.values()):
                  raise TypeError("test counts must be integers")
              total = counts["total"]
              passed = counts["passed"]
              failed = counts["failed"]
              skipped = counts["skipped"]
              expected_failures = counts["expected failures"]
              if any(value < 0 for value in counts.values()):
                  raise ValueError("test counts must be nonnegative")
              if any(value > total for name, value in counts.items() if name != "total"):
                  raise ValueError("a test category exceeds the total test count")
              if passed + failed + skipped + expected_failures != total:
                  raise ValueError("test categories do not account for the total test count")
          except (KeyError, TypeError, ValueError, json.JSONDecodeError) as error:
              with job_summary_path.open("a", encoding="utf-8") as output:
                  output.write("### iOS simulator tests\n\nStructured result data is corrupt or incomplete.\n")
              raise SystemExit(f"invalid xcresult summary: {error}")

          with job_summary_path.open("a", encoding="utf-8") as output:
              output.write("### iOS simulator tests\n\n")
              output.write("| Result | Total | Passed | Failed | Skipped | Expected failures |\n")
              output.write("| --- | ---: | ---: | ---: | ---: | ---: |\n")
              output.write(
                  f"| {result} | {total} | {passed} | {failed} | {skipped} | {expected_failures} |\n"
              )

          # The test step runs xcodebuild -quiet, which prints only the names
          # of failing tests. Surface each failure's message and location from
          # the result bundle so a red run can be diagnosed from the job log.
          # Indentation is for readability; the runner trims whitespace.
          # Disable workflow commands while printing untrusted test text.
          failures = summary.get("testFailures") or []
          if failures:
              lines = []
              for failure in failures:
                  name = failure.get("testIdentifierString") or failure.get("testName") or "unknown test"
                  target = failure.get("targetName") or "unknown target"
                  text = failure.get("failureText") or "(no failure text)"
                  lines.append(f"{target} {name}")
                  lines.extend(f"    {line}" for line in str(text).splitlines() or [""])
              print("Test failures:")
              token = uuid.uuid4().hex
              print(f"::stop-commands::{token}", flush=True)
              try:
                  for line in lines:
                      print(f"  {line}")
              finally:
                  print(f"::{token}::", flush=True)
              with job_summary_path.open("a", encoding="utf-8") as output:
                  output.write("\n#### Failures\n\n```text\n")
                  for line in lines:
                      output.write(line.replace("```", "'''") + "\n")
                  output.write("```\n")

          if total <= 0:
              raise SystemExit("xcresult contains zero tests")
          print(f"iOS tests: result={result}, total={total}, passed={passed}, failed={failed}, skipped={skipped}, expected_failures={expected_failures}")
          if failed != 0 or result != "Passed":
              raise SystemExit(f"tests did not pass: result={result}, failed={failed}")
          PY

      - name: Verify UI execution and bundle durations
        if: ${{ always() && needs.plan.outputs.mode == 'smoke' }}
        shell: bash
        env:
          TEST_MODE: ${{ needs.plan.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$CI_OUTPUT_ROOT"
          # Inspect Xcode 27.2's per-node fields; retain the schema with the JSON.
          xcrun xcresulttool get test-results tests --schema \
            --path "$CI_OUTPUT_ROOT/Tests.xcresult" > "$CI_OUTPUT_ROOT/test-tree-schema.json"
          xcrun xcresulttool get test-results tests \
            --path "$CI_OUTPUT_ROOT/Tests.xcresult" --compact > "$CI_OUTPUT_ROOT/test-tree.json"
          python3 -m scripts.ios_ui_smoke verify-lane --lane build \
            --manifest "$CI_OUTPUT_ROOT/manifest.json" --tests-json "$CI_OUTPUT_ROOT/test-tree.json" \
            --summary-json "$CI_OUTPUT_ROOT/test-summary.json" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload structured test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-evidence-${{ github.run_attempt }}-build
          path: |
            ${{ env.CI_OUTPUT_ROOT }}/test-*.json
            ${{ env.CI_OUTPUT_ROOT }}/build-timings.jsonl
            ${{ env.CI_OUTPUT_ROOT }}/enumerated-tests.json
            ${{ env.CI_OUTPUT_ROOT }}/manifest.json
            ${{ env.CI_OUTPUT_ROOT }}/*.log
          if-no-files-found: error
          retention-days: 14

      - name: Delete owned simulator
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl delete "$SIMULATOR_UDID"

      - name: Save KMP dependencies outside release PRs
        if: (github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'release/1.1.0') && steps.kmp.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches/modules-2/files-2.1
            ~/.konan/dependencies
          key: ${{ steps.kmp.outputs.cache-primary-key }}

      - name: Save SPM checkouts outside release PRs
        if: (github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'release/1.1.0') && steps.spm.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.SPM_SOURCE_ROOT }}/checkouts
            ${{ env.SPM_SOURCE_ROOT }}/repositories
          key: ${{ steps.spm.outputs.cache-primary-key }}

  tests:
    name: iOS full tests (${{ matrix.lane }})
    needs: [plan, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.plan.outputs.mode == 'full' }}
    runs-on: xcode-27
    # Step limit plus setup, evidence and cleanup; see the test step below.
    timeout-minutes: 55
    strategy:
      fail-fast: false
      # The default starts one unit job and four UI jobs after the build.
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TEST_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Initialize isolated test paths
        shell: bash
        run: |
          set -euo pipefail
          output_root="$RUNNER_TEMP/beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$TEST_LANE"
          mkdir -p "$output_root"
          printf 'CI_OUTPUT_ROOT=%s\n' "$output_root" >> "$GITHUB_ENV"

      - name: Download full-mode test products
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.products_artifact_name }}
          path: ${{ env.CI_OUTPUT_ROOT }}

      - name: Validate and restore test products
        id: products
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 27.2"
          xctestrun="$(python3 -m scripts.ios_ci_products unpack \
            --archive "$CI_OUTPUT_ROOT/products.tar" --derived-data "$CI_OUTPUT_ROOT/DerivedData" \
            --sha "$EXPECTED_SHA" --xcode "$(xcodebuild -version)" \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-version)" --arch "$(uname -m)")"
          cp "$CI_OUTPUT_ROOT/DerivedData/manifest.json" "$CI_OUTPUT_ROOT/manifest.json"
          printf 'xctestrun=%s\n' "$xctestrun" >> "$GITHUB_OUTPUT"

      - name: Create shard-owned simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(python3 scripts/ci_simulator.py \
            --name "ci-beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-$TEST_LANE")"
          printf 'udid=%s\n' "$simulator_udid" >> "$GITHUB_OUTPUT"

      - name: Boot shard-owned simulator
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Execute full-mode test lane
        id: run_tests
        # UI shards plan at about 20 minutes of test-case time, but single tests stall
        # for 2 to 5 minutes on hosted xcode-27 runners (2026-11-25); 40 is containment
        # until the stalls are explained, not a speed target.
        timeout-minutes: 40
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          XCTESTRUN: ${{ steps.products.outputs.xctestrun }}
        run: |
          set -euo pipefail
          python3 -m scripts.ios_ui_smoke lane-arguments --lane "$TEST_LANE" \
            --manifest "$CI_OUTPUT_ROOT/manifest.json" > "$CI_OUTPUT_ROOT/test-arguments.txt"
          test_args=()
          while IFS= read -r argument; do
            test_args+=("$argument")
          done < "$CI_OUTPUT_ROOT/test-arguments.txt"
          xcodebuild -quiet test-without-building -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$CI_OUTPUT_ROOT/DerivedData" \
            -resultBundlePath "$CI_OUTPUT_ROOT/Tests.xcresult" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            "${test_args[@]}"

      - name: Collect shard structured results
        id: structured
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary --path "$CI_OUTPUT_ROOT/Tests.xcresult" \
            --compact > "$CI_OUTPUT_ROOT/test-summary.json"
          xcrun xcresulttool get test-results tests --schema --path "$CI_OUTPUT_ROOT/Tests.xcresult" \
            > "$CI_OUTPUT_ROOT/test-tree-schema.json"
          xcrun xcresulttool get test-results tests --path "$CI_OUTPUT_ROOT/Tests.xcresult" \
            --compact > "$CI_OUTPUT_ROOT/test-tree.json"
          python3 -m scripts.ios_ui_smoke verify-lane --lane "$TEST_LANE" \
            --manifest "$CI_OUTPUT_ROOT/manifest.json" --tests-json "$CI_OUTPUT_ROOT/test-tree.json" \
            --summary-json "$CI_OUTPUT_ROOT/test-summary.json" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload shard test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-evidence-${{ github.run_attempt }}-${{ matrix.lane }}
          path: |
            ${{ env.CI_OUTPUT_ROOT }}/test-*.json
            ${{ env.CI_OUTPUT_ROOT }}/manifest.json
          if-no-files-found: error
          retention-days: 14

      # Preserve a partial bundle too when the test step reaches its time limit.
      # A job terminated by the runner cannot execute any remaining steps.
      - name: Archive failed UI test result
        id: archive
        if: ${{ always() && startsWith(matrix.lane, 'ui-') && steps.run_tests.outcome != 'skipped' && (steps.run_tests.outcome != 'success' || steps.structured.outcome == 'failure') }}
        timeout-minutes: 3
        env:
          MAX_ARCHIVE_BYTES: '262144000'
        shell: bash
        run: |
          set -euo pipefail
          cd "$CI_OUTPUT_ROOT"
          if [[ ! -d Tests.xcresult ]]; then
            echo "::notice::No Tests.xcresult was written."
            exit 0
          fi
          tar -czf Tests.xcresult.tar.gz Tests.xcresult
          if (( $(wc -c < Tests.xcresult.tar.gz) > MAX_ARCHIVE_BYTES )); then
            echo "::warning::Compressed Tests.xcresult exceeds the upload limit."
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Upload failed UI test result
        if: ${{ always() && steps.archive.outputs.ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 4
        with:
          name: ios-xcresult-${{ github.run_attempt }}-${{ matrix.lane }}
          path: ${{ env.CI_OUTPUT_ROOT }}/Tests.xcresult.tar.gz
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Delete shard-owned simulator
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl delete "$SIMULATOR_UDID"

  ios-simulator:
    name: ${{ matrix.context }}
    strategy:
      matrix:
        context:
          - iOS simulator
          - iOS simulator (inactive)
        exclude:
          - context: ${{ (github.event_name != 'pull_request' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' || github.event.action == 'ready_for_review' || github.event.action == 'labeled' && github.event.label.name == 'ci:full-ui') && 'iOS simulator (inactive)' || 'iOS simulator' }}
    needs: [changes, plan, build, tests]
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Record inactive PR event
        if: ${{ matrix.context == 'iOS simulator (inactive)' }}
        run: echo 'This PR event requests no iOS tests.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ matrix.context == 'iOS simulator' }}
        with:
          ref: ${{ needs.plan.outputs.previous && github.event.pull_request.base.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download structured test evidence
        if: ${{ matrix.context == 'iOS simulator' && needs.plan.outputs.run == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ios-evidence-*
          merge-multiple: false
          path: ${{ runner.temp }}/ios-evidence

      - name: Verify all job results and execution ledger
        if: ${{ always() && matrix.context == 'iOS simulator' }}
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-evidence"
          printf '%s\n' "$NEEDS_JSON" > "$RUNNER_TEMP/ios-needs.json"
          python3 -m scripts.ios_ui_smoke aggregate --event-name "$EVENT_NAME" \
            --needs-json "$RUNNER_TEMP/ios-needs.json" --evidence-root "$RUNNER_TEMP/ios-evidence" \
            --attempt "$GITHUB_RUN_ATTEMPT" --sha "$EXPECTED_SHA" --summary "$GITHUB_STEP_SUMMARY"

  selection-shadow:
    name: Compare proposed UI test selection
    # Independent of the required iOS check and all test invocations.
    needs: [changes, plan, build, tests]
    if: ${{ always() && needs.plan.outputs.mode == 'full' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download full test evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ios-evidence-*
          merge-multiple: false
          path: ${{ runner.temp }}/ios-evidence

      - name: Compare proposed selection with executed tests
        shell: bash
        env:
          CHANGE_INPUT: ${{ needs.changes.outputs.shadow_paths }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_ATTEMPT: ${{ needs.build.outputs.evidence_attempt }}
        run: |
          set -euo pipefail
          printf '%s\n' "$CHANGE_INPUT" > "$RUNNER_TEMP/changed-paths.json"
          python3 -m scripts.ios_ui_selection_shadow --evidence "$RUNNER_TEMP/ios-evidence" \
            --changes "$RUNNER_TEMP/changed-paths.json" --attempt "$GITHUB_RUN_ATTEMPT" \
            --build-attempt "$BUILD_ATTEMPT" --sha "$EXPECTED_SHA" --base-sha "$BASE_SHA" > "$RUNNER_TEMP/ui-selection.json"

      - name: Upload proposed selection and comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-ui-selection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui-selection.json
          if-no-files-found: error
          retention-days: 14
