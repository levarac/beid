name: PR iOS CI
# Display only: execution mode is selected once below from the immutable event file.
run-name: "iOS simulator (${{ github.event_name == 'pull_request' && github.event.pull_request.labels != null && !contains(github.event.pull_request.labels.*.name, 'ci:full-ui') && 'smoke' || 'full' }}) — ${{ github.event_name }} — ${{ github.ref_name }}"

on:
  # Always report a status for every PR head, including drafts. Workflow-level
  # path filters would leave a required context pending on unrelated changes.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
    types: [checks_requested]
  push:
    # Measure the merged result on main exactly once. Note the concurrency
    # group below is keyed on github.ref with cancel-in-progress, so two merges
    # landing back to back cancel the earlier main run: this guarantees a run
    # starts per merge, not that every one finishes.
    branches: [main]
    paths:
      - ".github/workflows/pr-ci-ios-macos.yml"
      - "ios/**"
      - "shared/**"
      - "android/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "android/gradle.properties"
      - "android/gradlew"
      - "android/gradle/wrapper/**"
      - "android/gradle/*.toml"
      - "scripts/ci_change_filter.py"
      - "scripts/xcodegen_generate_checked.sh"
      - "scripts/resolve_kmp_java_home.sh"
      - "scripts/download_xcodegen.sh"
      - "scripts/ci_simulator.py"
      - "scripts/ios_ui_smoke.py"
      - "scripts/ios_ci_timing.py"
      - "scripts/ios_ci_products.py"
      - "scripts/ios-ui-durations.json"
      - "scripts/ios-ui-iphone-skips.txt"
      - "scripts/run_local_tests.py"
  # Escape hatch: run this lane against any ref on demand. `paths` does not
  # apply to workflow_dispatch, so a manual run always executes.
  workflow_dispatch:
  # 03:23 UTC avoids the busy top of the hour; scheduled workflows use main,
  # the default branch. Its separate group cannot cancel a main push.
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
  # Change only this value to use two UI shards (three test jobs in total).
  IOS_UI_SHARDS: '3'

concurrency:
  # Event and ref/PR identity isolate queue entries from PR updates and main pushes.
  group: pr-ios-macos-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify paths for iOS lane
    # Pull requests only: merge groups, main pushes, nightly and manual runs bypass classification.
    # The name differs from pr-ci.yml's "Determine changed paths" on purpose:
    # required status contexts are keyed by job name.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.classify.outputs.ios }}
      error: ${{ steps.classify.outputs.error }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Collect changed paths
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const outputPath = `${process.env.RUNNER_TEMP}/beid-changed-files.json`;
            // The compare API returns at most 300 files. A list that reaches the cap
            // may be truncated, and a truncated list can look documentation-only.
            const FILE_LIMIT = 300;
            try {
              // Pinned to this event's own SHAs, never to the pull request's current
              // file list: a re-run of an older run must classify what it builds.
              let basehead;
              if (context.eventName === 'pull_request') {
                const { base, head } = context.payload.pull_request;
                basehead = `${base.sha}...${head.sha}`;
              } else if (context.eventName === 'merge_group') {
                const { base_sha, head_sha } = context.payload.merge_group || {};
                if (!/^[0-9a-f]{40}$/i.test(base_sha || '') || !/^[0-9a-f]{40}$/i.test(head_sha || '')) {
                  throw new Error('merge group is missing valid base/head SHAs');
                }
                basehead = `${base_sha}...${head_sha}`;
              } else if (context.eventName === 'push' && context.payload.before && !/^0+$/.test(context.payload.before)) {
                basehead = `${context.payload.before}...${context.payload.after}`;
              } else {
                throw new Error(`unsupported or unbounded event: ${context.eventName}`);
              }
              let listed = 0;
              let firstPage = true;
              let iosForceRun = false;
              const files = await github.paginate(
                github.rest.repos.compareCommitsWithBasehead,
                { owner: context.repo.owner, repo: context.repo.repo, basehead, per_page: 100 },
                response => {
                  // Compare pagination is by commit; files exist only on page 1.
                  if (!firstPage) return [];
                  firstPage = false;
                  const page = response.data.files;
                  if (!Array.isArray(page)) {
                    throw new Error('first compare page is missing a files array');
                  }
                  listed = page.length;
                  // Renames, deletions and incomplete metadata are never safe
                  // evidence for skipping iOS, even inside excluded directories.
                  iosForceRun ||= page.some(file =>
                    !['added', 'modified'].includes(file.status) ||
                    typeof file.filename !== 'string' || !file.filename ||
                    Boolean(file.previous_filename));
                  return page.flatMap(file => [file.filename, file.previous_filename].filter(Boolean));
                },
              );
              if (listed >= FILE_LIMIT) {
                throw new Error(`file list may be truncated at ${FILE_LIMIT} files (${listed} listed)`);
              }
              fs.writeFileSync(outputPath, JSON.stringify(iosForceRun ? { files, ios_force_run: true } : { files }), 'utf8');
            } catch (error) {
              core.warning(`changed-path collection failed; all checks will run: ${error.message}`);
              fs.writeFileSync(outputPath, JSON.stringify({ error: String(error) }), 'utf8');
            }

      - name: Classify changed paths (fail closed)
        id: classify
        if: always()
        run: python3 scripts/ci_change_filter.py --input "$RUNNER_TEMP/beid-changed-files.json" >> "$GITHUB_OUTPUT"

  plan:
    name: Plan iOS test jobs
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      mode: ${{ steps.test-mode.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Determine test mode
        id: test-mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 -m scripts.ios_ui_smoke mode \
            --event-name "$EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"

      - name: Plan bounded test matrix
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_JSON: ${{ toJSON(needs.changes) }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from scripts.ios_ui_smoke import classifier_skip
          count = int(os.environ['IOS_UI_SHARDS'])
          if count not in (2, 3):
              raise SystemExit('IOS_UI_SHARDS must be 2 or 3')
          skip = classifier_skip(os.environ['EVENT_NAME'], {'changes': json.loads(os.environ['CHANGES_JSON'])})
          print(f'run={str(not skip).lower()}')
          print('matrix=' + json.dumps({'lane': ['unit'] + [f'ui-{i + 1}' for i in range(count)]}))
          PY

  build:
    name: Build iOS test bundles
    needs: [changes, plan]
    # A failed/missing classifier runs the lane. Smoke builds and tests here;
    # full builds once here, then runs the artifact on independent test jobs.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run == 'true' }}
    # Keep PR code on disposable hosted runners; repository variables must
    # never route a fork pull request back to a persistent signing host.
    runs-on: macos-26
    # The former serial full job hit 60 minutes. Full mode now builds once
    # and fans out to <=4 macOS test jobs. Smoke retains its single job.
    # 45 minutes is containment for build/smoke, not a performance target.
    timeout-minutes: 45
    steps:
      - name: Initialize CI output path
        shell: bash
        run: |
          set -euo pipefail
          printf 'CI_OUTPUT_ROOT=%s\n' "$RUNNER_TEMP/beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          # Stable dependency-only location; never cache DerivedData/results.
          printf 'SPM_SOURCE_ROOT=%s\n' "$RUNNER_TEMP/beid-spm/SourcePackages" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Point KMP JDK resolver at setup-java
        shell: bash
        run: |
          set -euo pipefail
          printf 'KMP_JAVA_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Resolve Xcode and JDK with the iOS 26.5 runtime
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
          xcrun simctl list runtimes --json \
            | python3 -c 'import json, sys; runtimes = json.load(sys.stdin)["runtimes"]; raise SystemExit(0 if any(item.get("isAvailable") and item.get("name") == "iOS 26.5" for item in runtimes) else "iOS 26.5 runtime is unavailable")'

          kmp_java_home="$(scripts/resolve_kmp_java_home.sh)"
          "$kmp_java_home/bin/java" -version
          xcodebuild -version

          {
            echo "KMP_JAVA_HOME=$kmp_java_home"
            echo "JAVA_HOME=$kmp_java_home"
          } >> "$GITHUB_ENV"
          {
            printf 'xcode=%s\n' "$(xcodebuild -version | shasum -a 256 | awk '{print $1}')"
            printf 'sdk=%s\n' "$(xcrun --sdk iphonesimulator --show-sdk-build-version)"
            printf 'jdk=%s\n' "$("$kmp_java_home/bin/java" -version 2>&1 | shasum -a 256 | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Cache KMP dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            !~/.gradle/caches/build-cache-*
            !~/.gradle/caches/*/executionHistory
            ~/.gradle/wrapper
            ~/.konan
          # The Kotlin version is declared in android/build.gradle.kts today.
          # No prefix restore: a toolchain/configuration mismatch stays cold.
          key: beid-ios-kmp-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ steps.toolchain.outputs.sdk }}-${{ steps.toolchain.outputs.jdk }}-${{ hashFiles('android/gradle/*.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle.kts', 'android/settings.gradle.kts', 'android/gradle.properties', 'shared/build.gradle.kts') }}

      - name: Cache SPM checkouts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Repository objects keep checkouts' Git alternates valid. Neither
          # SwiftPM build products nor DerivedData are included.
          path: |
            ${{ env.SPM_SOURCE_ROOT }}/checkouts
            ${{ env.SPM_SOURCE_ROOT }}/repositories
          key: beid-ios-spm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('ios/Beid.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/xcodegen-pinned"
          scripts/download_xcodegen.sh "$install_dir"
          printf '%s\n' "$install_dir/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Verify XcodeGen pin and generated project
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(tr -d '[:space:]' < ios/ci_scripts/XCODEGEN_VERSION)"
          installed_version=""
          if command -v xcodegen >/dev/null 2>&1; then
            installed_version="$(xcodegen --version | awk '{print $2}')"
          fi
          if [[ "$installed_version" != "$expected_version" ]]; then
            echo "error: XcodeGen $expected_version is required; found ${installed_version:-none}" >&2
            exit 1
          fi

          echo "Using XcodeGen: $(xcodegen --version)"
          scripts/xcodegen_generate_checked.sh
          (
            cd ios
            if [[ -n "$(git status --porcelain -- Beid.xcodeproj)" ]]; then
              echo "error: Beid.xcodeproj is out of sync with project.yml" >&2
              git status --porcelain -- Beid.xcodeproj >&2
              exit 1
            fi
          )

      - name: Create owned simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(python3 scripts/ci_simulator.py \
            --name "ci-beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB")"
          printf 'udid=%s\n' "$simulator_udid" >> "$GITHUB_OUTPUT"

      # A newly created device is already clean. Never erase or reuse one
      # found in the host's device list: it may belong to another job or seat.
      - name: Boot owned simulator
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Build for testing
        timeout-minutes: 25
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p "$CI_OUTPUT_ROOT"
          python3 -m scripts.ios_ci_timing --phase spm \
            --log "$CI_OUTPUT_ROOT/spm.log" --timings "$CI_OUTPUT_ROOT/build-timings.jsonl" -- \
            xcodebuild -resolvePackageDependencies -project ios/Beid.xcodeproj -scheme Beid \
            -clonedSourcePackagesDirPath "$SPM_SOURCE_ROOT" -onlyUsePackageVersionsFromResolvedFile
          python3 -m scripts.ios_ci_timing --phase build \
            --log "$CI_OUTPUT_ROOT/build.log" --timings "$CI_OUTPUT_ROOT/build-timings.jsonl" -- \
            xcodebuild -showBuildTimingSummary \
            -project ios/Beid.xcodeproj \
            -scheme Beid \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$CI_OUTPUT_ROOT/DerivedData" \
            -clonedSourcePackagesDirPath "$SPM_SOURCE_ROOT" \
            -disableAutomaticPackageResolution \
            SWIFT_OPTIMIZATION_LEVEL=-O \
            build-for-testing

      - name: Enumerate built tests and compute shards
        id: enumerate
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          TEST_MODE: ${{ needs.plan.outputs.mode }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          xctestrun="$(python3 -c 'import os; from pathlib import Path; from scripts.ios_ci_products import test_run; print(test_run(Path(os.environ["CI_OUTPUT_ROOT"]) / "DerivedData"))')"
          printf 'xctestrun=%s\n' "$xctestrun" >> "$GITHUB_OUTPUT"
          xcodebuild -quiet test-without-building -xctestrun "$xctestrun" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -enumerate-tests -test-enumeration-style hierarchical -test-enumeration-format json \
            -test-enumeration-output-path "$CI_OUTPUT_ROOT/enumerated-tests.json"
          python3 -m scripts.ios_ui_smoke shards --mode "$TEST_MODE" \
            --enumeration "$CI_OUTPUT_ROOT/enumerated-tests.json" --count "$IOS_UI_SHARDS" \
            --sha "$EXPECTED_SHA" --output "$CI_OUTPUT_ROOT/manifest.json"

      - name: Package full-mode test products
        if: ${{ needs.plan.outputs.mode == 'full' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -m scripts.ios_ci_products pack --derived-data "$CI_OUTPUT_ROOT/DerivedData" \
            --manifest "$CI_OUTPUT_ROOT/manifest.json" --archive "$CI_OUTPUT_ROOT/products.tar" \
            --sha "$EXPECTED_SHA" --xcode "$(xcodebuild -version)" \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-version)" --arch "$(uname -m)"

      - name: Upload full-mode test products
        if: ${{ needs.plan.outputs.mode == 'full' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-products-${{ github.run_attempt }}
          path: ${{ env.CI_OUTPUT_ROOT }}/products.tar
          compression-level: 1
          if-no-files-found: error
          retention-days: 3

      - name: Test without rebuilding
        if: ${{ needs.plan.outputs.mode == 'smoke' }}
        timeout-minutes: 10
        shell: bash
        env:
          TEST_MODE: ${{ needs.plan.outputs.mode }}
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          XCTESTRUN: ${{ steps.enumerate.outputs.xctestrun }}
        run: |
          set -euo pipefail
          # Materialize before reading: a parser failure must stop the test step.
          python3 -m scripts.ios_ui_smoke arguments --mode "$TEST_MODE" \
            > "$CI_OUTPUT_ROOT/test-arguments.txt"
          test_args=(SWIFT_OPTIMIZATION_LEVEL=-O)
          while IFS= read -r argument; do
            test_args+=("$argument")
          done < "$CI_OUTPUT_ROOT/test-arguments.txt"
          xcodebuild -quiet \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$CI_OUTPUT_ROOT/DerivedData" \
            -resultBundlePath "$CI_OUTPUT_ROOT/Tests.xcresult" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            "${test_args[@]}" \
            test-without-building

      - name: Summarize structured test results
        if: ${{ always() && needs.plan.outputs.mode == 'smoke' }}
        shell: bash
        run: |
          set -euo pipefail
          result_bundle="$CI_OUTPUT_ROOT/Tests.xcresult"
          summary_json="$CI_OUTPUT_ROOT/test-summary.json"

          if [[ ! -d "$result_bundle" ]]; then
            echo "### iOS simulator tests" >> "$GITHUB_STEP_SUMMARY"
            echo "Result bundle missing; tests did not produce verifiable results." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! xcrun xcresulttool get test-results summary --path "$result_bundle" --compact > "$summary_json"; then
            echo "### iOS simulator tests" >> "$GITHUB_STEP_SUMMARY"
            echo "Result bundle could not be parsed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          python3 - "$summary_json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys
          import uuid

          summary_path = pathlib.Path(sys.argv[1])
          job_summary_path = pathlib.Path(sys.argv[2])
          try:
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
              result = summary["result"]
              counts = {
                  "total": summary["totalTestCount"],
                  "passed": summary["passedTests"],
                  "failed": summary["failedTests"],
                  "skipped": summary["skippedTests"],
                  "expected failures": summary["expectedFailures"],
              }
              if any(isinstance(value, bool) or not isinstance(value, int) for value in counts.values()):
                  raise TypeError("test counts must be integers")
              total = counts["total"]
              passed = counts["passed"]
              failed = counts["failed"]
              skipped = counts["skipped"]
              expected_failures = counts["expected failures"]
              if any(value < 0 for value in counts.values()):
                  raise ValueError("test counts must be nonnegative")
              if any(value > total for name, value in counts.items() if name != "total"):
                  raise ValueError("a test category exceeds the total test count")
              if passed + failed + skipped + expected_failures != total:
                  raise ValueError("test categories do not account for the total test count")
          except (KeyError, TypeError, ValueError, json.JSONDecodeError) as error:
              with job_summary_path.open("a", encoding="utf-8") as output:
                  output.write("### iOS simulator tests\n\nStructured result data is corrupt or incomplete.\n")
              raise SystemExit(f"invalid xcresult summary: {error}")

          with job_summary_path.open("a", encoding="utf-8") as output:
              output.write("### iOS simulator tests\n\n")
              output.write("| Result | Total | Passed | Failed | Skipped | Expected failures |\n")
              output.write("| --- | ---: | ---: | ---: | ---: | ---: |\n")
              output.write(
                  f"| {result} | {total} | {passed} | {failed} | {skipped} | {expected_failures} |\n"
              )

          # The test step runs xcodebuild -quiet, which prints only the names
          # of failing tests. Surface each failure's message and location from
          # the result bundle so a red run can be diagnosed from the job log.
          # Indentation is for readability; the runner trims whitespace.
          # Disable workflow commands while printing untrusted test text.
          failures = summary.get("testFailures") or []
          if failures:
              lines = []
              for failure in failures:
                  name = failure.get("testIdentifierString") or failure.get("testName") or "unknown test"
                  target = failure.get("targetName") or "unknown target"
                  text = failure.get("failureText") or "(no failure text)"
                  lines.append(f"{target} {name}")
                  lines.extend(f"    {line}" for line in str(text).splitlines() or [""])
              print("Test failures:")
              token = uuid.uuid4().hex
              print(f"::stop-commands::{token}", flush=True)
              try:
                  for line in lines:
                      print(f"  {line}")
              finally:
                  print(f"::{token}::", flush=True)
              with job_summary_path.open("a", encoding="utf-8") as output:
                  output.write("\n#### Failures\n\n```text\n")
                  for line in lines:
                      output.write(line.replace("```", "'''") + "\n")
                  output.write("```\n")

          if total <= 0:
              raise SystemExit("xcresult contains zero tests")
          print(f"iOS tests: result={result}, total={total}, passed={passed}, failed={failed}, skipped={skipped}, expected_failures={expected_failures}")
          if failed != 0 or result != "Passed":
              raise SystemExit(f"tests did not pass: result={result}, failed={failed}")
          PY

      - name: Verify UI execution and bundle durations
        if: ${{ always() && needs.plan.outputs.mode == 'smoke' }}
        shell: bash
        env:
          TEST_MODE: ${{ needs.plan.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$CI_OUTPUT_ROOT"
          # Inspect Xcode 26.5's per-node fields; retain the schema with the JSON.
          xcrun xcresulttool get test-results tests --schema \
            --path "$CI_OUTPUT_ROOT/Tests.xcresult" > "$CI_OUTPUT_ROOT/test-tree-schema.json"
          xcrun xcresulttool get test-results tests \
            --path "$CI_OUTPUT_ROOT/Tests.xcresult" --compact > "$CI_OUTPUT_ROOT/test-tree.json"
          python3 -m scripts.ios_ui_smoke verify-lane --lane build \
            --manifest "$CI_OUTPUT_ROOT/manifest.json" --tests-json "$CI_OUTPUT_ROOT/test-tree.json" \
            --summary-json "$CI_OUTPUT_ROOT/test-summary.json" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload structured test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-evidence-${{ github.run_attempt }}-build
          path: |
            ${{ env.CI_OUTPUT_ROOT }}/test-*.json
            ${{ env.CI_OUTPUT_ROOT }}/build-timings.jsonl
            ${{ env.CI_OUTPUT_ROOT }}/enumerated-tests.json
            ${{ env.CI_OUTPUT_ROOT }}/manifest.json
            ${{ env.CI_OUTPUT_ROOT }}/*.log
          if-no-files-found: error
          retention-days: 14

      - name: Delete owned simulator
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl delete "$SIMULATOR_UDID"

  tests:
    name: iOS full tests (${{ matrix.lane }})
    needs: [plan, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.plan.outputs.mode == 'full' }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # One unit job + <=3 UI shards; build has finished before these start.
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TEST_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Initialize isolated test paths
        shell: bash
        run: |
          set -euo pipefail
          output_root="$RUNNER_TEMP/beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$TEST_LANE"
          mkdir -p "$output_root"
          printf 'CI_OUTPUT_ROOT=%s\n' "$output_root" >> "$GITHUB_ENV"

      - name: Download full-mode test products
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-products-${{ github.run_attempt }}
          path: ${{ env.CI_OUTPUT_ROOT }}

      - name: Validate and restore test products
        id: products
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
          xctestrun="$(python3 -m scripts.ios_ci_products unpack \
            --archive "$CI_OUTPUT_ROOT/products.tar" --derived-data "$CI_OUTPUT_ROOT/DerivedData" \
            --sha "$EXPECTED_SHA" --xcode "$(xcodebuild -version)" \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-version)" --arch "$(uname -m)")"
          cp "$CI_OUTPUT_ROOT/DerivedData/manifest.json" "$CI_OUTPUT_ROOT/manifest.json"
          printf 'xctestrun=%s\n' "$xctestrun" >> "$GITHUB_OUTPUT"

      - name: Create shard-owned simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(python3 scripts/ci_simulator.py \
            --name "ci-beid-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-$TEST_LANE")"
          printf 'udid=%s\n' "$simulator_udid" >> "$GITHUB_OUTPUT"

      - name: Boot shard-owned simulator
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Execute full-mode test lane
        timeout-minutes: 35
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          XCTESTRUN: ${{ steps.products.outputs.xctestrun }}
        run: |
          set -euo pipefail
          python3 -m scripts.ios_ui_smoke lane-arguments --lane "$TEST_LANE" \
            --manifest "$CI_OUTPUT_ROOT/manifest.json" > "$CI_OUTPUT_ROOT/test-arguments.txt"
          test_args=()
          while IFS= read -r argument; do
            test_args+=("$argument")
          done < "$CI_OUTPUT_ROOT/test-arguments.txt"
          xcodebuild -quiet test-without-building -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$CI_OUTPUT_ROOT/DerivedData" \
            -resultBundlePath "$CI_OUTPUT_ROOT/Tests.xcresult" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            "${test_args[@]}"

      - name: Collect shard structured results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary --path "$CI_OUTPUT_ROOT/Tests.xcresult" \
            --compact > "$CI_OUTPUT_ROOT/test-summary.json"
          xcrun xcresulttool get test-results tests --schema --path "$CI_OUTPUT_ROOT/Tests.xcresult" \
            > "$CI_OUTPUT_ROOT/test-tree-schema.json"
          xcrun xcresulttool get test-results tests --path "$CI_OUTPUT_ROOT/Tests.xcresult" \
            --compact > "$CI_OUTPUT_ROOT/test-tree.json"
          python3 -m scripts.ios_ui_smoke verify-lane --lane "$TEST_LANE" \
            --manifest "$CI_OUTPUT_ROOT/manifest.json" --tests-json "$CI_OUTPUT_ROOT/test-tree.json" \
            --summary-json "$CI_OUTPUT_ROOT/test-summary.json" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload shard test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-evidence-${{ github.run_attempt }}-${{ matrix.lane }}
          path: |
            ${{ env.CI_OUTPUT_ROOT }}/test-*.json
            ${{ env.CI_OUTPUT_ROOT }}/manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Delete shard-owned simulator
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl delete "$SIMULATOR_UDID"

  ios-simulator:
    name: iOS simulator
    needs: [changes, plan, build, tests]
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download structured test evidence
        if: ${{ needs.plan.outputs.run == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ios-evidence-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/ios-evidence

      - name: Verify all job results and execution ledger
        if: always()
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-evidence"
          printf '%s\n' "$NEEDS_JSON" > "$RUNNER_TEMP/ios-needs.json"
          python3 -m scripts.ios_ui_smoke aggregate --event-name "$EVENT_NAME" \
            --needs-json "$RUNNER_TEMP/ios-needs.json" --evidence-root "$RUNNER_TEMP/ios-evidence" \
            --attempt "$GITHUB_RUN_ATTEMPT" --sha "$EXPECTED_SHA" --summary "$GITHUB_STEP_SUMMARY"
