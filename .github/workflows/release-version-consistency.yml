name: Release version consistency

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: read

jobs:
  verify:
    name: Match branch and marketing version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compare release branch with project version
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          ruby <<'RUBY'
          branch = ENV.fetch("RELEASE_BRANCH")
          match = branch.match(%r{\Arelease/(\d+\.\d+\.\d+)\z})
          abort "::error::Release branch must be named release/X.Y.Z; got #{branch.inspect}" unless match

          versions = File.read("ios/Version.xcconfig").scan(/^\s*MARKETING_VERSION\s*=\s*(\S+)\s*$/).flatten
          abort "::error::ios/Version.xcconfig must set MARKETING_VERSION exactly once; found #{versions.length}" unless versions.length == 1
          version = versions.first

          expected = match[1]
          abort "::error::Release branch version #{expected} does not match ios/Version.xcconfig MARKETING_VERSION #{version}" unless version == expected

          puts "Release branch #{branch} matches MARKETING_VERSION #{version}"
          RUBY
