name: PR lab CLI (GitHub-hosted macOS)

# The standalone macOS package keeps its own short build/test lane.
on:
  # Always report a status for every PR head, including drafts. Workflow-level
  # path filters would leave a required context pending on unrelated changes.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - ".github/workflows/pr-ci-lab-cli.yml"
      - "tools/beid-lab-cli/**"
      - "scripts/ci_change_filter.py"
      - "scripts/check_lab_cli_barnard_pin.py"
      - "scripts/check_observe_never_connects.py"
      - "ios/project.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

concurrency:
  # Its own group: cancelling this must never cancel the simulator lane, and
  # vice versa.
  group: pr-lab-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify paths for lab CLI lane
    # Pull requests only: main pushes and manual dispatch always run the lane.
    # The name differs from pr-ci.yml's "Determine changed paths" on purpose:
    # required status contexts are keyed by job name.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      labcli: ${{ steps.classify.outputs.labcli }}
      lint: ${{ steps.classify.outputs.lint }}
      error: ${{ steps.classify.outputs.error }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Collect changed paths
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const outputPath = `${process.env.RUNNER_TEMP}/beid-changed-files.json`;
            // The compare API returns at most 300 files. A list that reaches the cap
            // may be truncated, and a truncated list can look documentation-only.
            const FILE_LIMIT = 300;
            try {
              // Pinned to this event's own SHAs, never to the pull request's current
              // file list: a re-run of an older run must classify what it builds.
              let basehead;
              if (context.eventName === 'pull_request') {
                const { base, head } = context.payload.pull_request;
                basehead = `${base.sha}...${head.sha}`;
              } else if (context.eventName === 'push' && context.payload.before && !/^0+$/.test(context.payload.before)) {
                basehead = `${context.payload.before}...${context.payload.after}`;
              } else {
                throw new Error(`unsupported or unbounded event: ${context.eventName}`);
              }
              let listed = 0;
              const files = await github.paginate(
                github.rest.repos.compareCommitsWithBasehead,
                { owner: context.repo.owner, repo: context.repo.repo, basehead, per_page: 100 },
                response => {
                  const page = response.data.files || [];
                  listed += page.length;
                  return page.flatMap(file => [file.filename, file.previous_filename].filter(Boolean));
                },
              );
              if (listed >= FILE_LIMIT) {
                throw new Error(`file list may be truncated at ${FILE_LIMIT} files (${listed} listed)`);
              }
              fs.writeFileSync(outputPath, JSON.stringify({ files }), 'utf8');
            } catch (error) {
              core.warning(`changed-path collection failed; all checks will run: ${error.message}`);
              fs.writeFileSync(outputPath, JSON.stringify({ error: String(error) }), 'utf8');
            }

      - name: Classify changed paths (fail closed)
        id: classify
        if: always()
        run: python3 scripts/ci_change_filter.py --input "$RUNNER_TEMP/beid-changed-files.json" >> "$GITHUB_OUTPUT"

  lab-cli:
    name: beid-lab-cli build and test
    needs: changes
    # Still created on every PR head so the required context reports; a PR that
    # touches neither the lab CLI nor the iOS app reports it as skipped. Fail
    # closed: a failed classification runs the lane. `!cancelled()` rather than
    # `always()` so a superseded run does not start a macOS job.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.labcli == 'true' || needs.changes.outputs.lint == 'true' || needs.changes.outputs.error == 'true') }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify the Barnard pin matches the app
        # First, and outside the Swift build, because it is the failure that
        # invalidates everything the tool would otherwise measure: a lab CLI
        # resolving a different Barnard than the app ships produces numbers
        # nobody can use, with no error anywhere.
        run: python3 scripts/check_lab_cli_barnard_pin.py

      - name: Verify observe never connects to what it measures
        run: python3 scripts/check_observe_never_connects.py

      - name: Build (release)
        # Release rather than debug: it is what a lab host actually runs, and
        # it is the configuration whose advertising carries no debug local
        # name.
        working-directory: tools/beid-lab-cli
        run: |
          # `set -o pipefail` is load bearing: without it the pipeline's exit
          # status is `tail`'s, which always succeeds, and a failed build would
          # pass this step.
          set -uo pipefail
          log="$RUNNER_TEMP/lab-cli-build.log"
          swift build -c release > "$log" 2>&1
          rc=$?
          tail -n 40 "$log"
          echo "build exit=$rc"
          exit "$rc"

      - name: Test
        working-directory: tools/beid-lab-cli
        # `BeidLabCliCore` imports Foundation only and `BeidLabCliBarnardTests`
        # is pure crypto, so nothing here needs a Bluetooth radio -- which is
        # appropriate for a hosted runner without access to a BLE device lab.
        run: |
          # Deliberately not `set -e`: it would abort on a failing `swift test`
          # before `rc` is captured, and the whole point here is to report the
          # child's own status alongside its test counts.
          set -uo pipefail
          log="$RUNNER_TEMP/lab-cli-tests.log"

          # The expected count comes from the package itself rather than a
          # number written here, so it cannot go stale. Its real job is to
          # catch a test target that silently did not run: green plus a
          # plausible-looking total is exactly what that failure looks like,
          # and this repository has the Gradle NO-SOURCE trap on record for
          # the same reason.
          expected=$(swift test --list-tests 2>/dev/null | grep -c .)
          echo "targets: $(swift test --list-tests 2>/dev/null | cut -d. -f1 | sort -u | tr '\n' ' ')"
          echo "expected tests: $expected"

          swift test > "$log" 2>&1
          rc=$?
          grep -E "Executed [0-9]+ tests" "$log" || true
          if [ "$rc" -ne 0 ]; then
            tail -n 120 "$log"
            echo "exit=$rc"
            exit "$rc"
          fi

          # Sum the per-bundle totals. Two toolchains disagree about whether
          # the bundles are reported separately or merged, so this reads the
          # `All tests` lines, which appear once per bundle either way.
          executed=$(grep -E "^Test Suite 'All tests' (passed|failed)" -A1 "$log" \
            | grep -oE "Executed [0-9]+ tests" | grep -oE "[0-9]+" \
            | awk '{ total += $1 } END { print total + 0 }')
          echo "executed tests: $executed"
          if [ "$expected" -eq 0 ] || [ "$executed" -lt "$expected" ]; then
            echo "error: expected $expected tests, $executed executed -- a test target did not run" >&2
            tail -n 60 "$log"
            exit 1
          fi
          echo "exit=$rc"
          exit "$rc"

      - name: Confirm --help runs from the built binary
        # Cheap end-to-end proof that the executable target links and starts.
        # Everything else in this job tests a library.
        working-directory: tools/beid-lab-cli
        run: |
          set -euo pipefail
          "$(swift build -c release --show-bin-path)/beid-lab-cli" --help > /dev/null
          echo "help ran and exited 0"
