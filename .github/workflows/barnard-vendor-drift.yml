name: Barnard vendor drift

on:
  pull_request:
    paths:
      - "ios/Vendor/**"
      - "ios/scripts/**"
      - "ios/README.md"
      - "ios/project.yml"
      - ".github/workflows/barnard-vendor-drift.yml"
  push:
    branches:
      - main
    paths:
      - "ios/Vendor/**"
      - "ios/scripts/**"
      - "ios/README.md"
      - "ios/project.yml"
      - ".github/workflows/barnard-vendor-drift.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-barnard-vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out beid
        uses: actions/checkout@v4
      - name: Run guard regression tests
        run: ios/scripts/tests/check-barnard-vendor-tests.sh
      - name: Compare vendor with the pinned upstream commit
        run: ios/scripts/check-barnard-vendor.sh
