name: Release TestFlight Delivery

on:
  push:
    branches:
      - "release/**"
    paths:
      - release_notes.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beid-ios-delivery
  cancel-in-progress: false

jobs:
  deliver:
    name: Archive and upload to TestFlight
    if: ${{ vars.GHA_DELIVERY == 'on' }}
    runs-on: [self-hosted, emi]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The delivery script resolves its JDK through
      # scripts/resolve_kmp_java_home.sh, which refuses to use an ambient
      # JAVA_HOME. On 2026-09-03 that refusal failed a delivery on `emi`
      # (run 33724513679) because no JDK the resolver looks for was present.
      # Pin one here rather than depending on the runner's ambient state —
      # the same two steps pr-ci-ios-macos.yml and internal-google-play.yml
      # already use.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
      - name: Point KMP JDK resolver at setup-java
        shell: bash
        run: |
          set -euo pipefail
          printf 'KMP_JAVA_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Archive and upload
        run: scripts/gha/build-and-upload-ios.sh
