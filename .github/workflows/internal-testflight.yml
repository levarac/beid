name: Internal TestFlight Delivery

on:
  push:
    branches:
      - main
      # Smoke test only; remove before merge.
      - ci/gha-testflight-lane
    paths:
      - what_to_test.json
      - what_to_test.ios.json
      # Smoke test only; lets the smoke-trigger push exercise this workflow.
      - .github/workflows/internal-testflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beid-ios-delivery
  cancel-in-progress: false

jobs:
  deliver:
    name: Archive and upload to TestFlight
    if: ${{ vars.GHA_DELIVERY == 'on' }}
    runs-on: [self-hosted, emi]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Archive and upload
        run: scripts/gha/build-and-upload-ios.sh
