name: Internal Google Play Delivery

on:
  push:
    branches:
      - main
    paths:
      - what_to_test.json
      - what_to_test.android.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beid-android-delivery
  cancel-in-progress: false

jobs:
  deliver:
    name: Build and upload AAB to internal testing
    # Android has its OWN switch, deliberately not the iOS one. `GHA_DELIVERY`
    # also gates internal-testflight.yml and release-testflight.yml, and
    # internal-testflight.yml fires on a push to `main` that changes
    # `what_to_test.json` -- the same file that fires this workflow. Sharing
    # one variable therefore means arming Android also arms an iOS upload to
    # App Store Connect, from the same commit, without anyone asking for it.
    # Separate gates are what make "Android only" expressible at all (gh#401).
    if: ${{ vars.GHA_ANDROID_DELIVERY == 'on' }}
    runs-on: ${{ vars.RUNS_ON_ANDROID || 'emi' }}
    timeout-minutes: 90
    steps:
      # GitHub-hosted runners leave limited free disk space; a release AAB
      # build can exhaust it. Reclaim space by dropping preinstalled
      # toolchains this job never uses. runner.environment guards every
      # hosted-only step below so none of them can fire on emi.
      - name: Free disk space (hosted runners only)
        if: runner.environment == 'github-hosted'
        run: |
          set -uo pipefail
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/share/powershell /usr/lib/jvm/temurin-*-jdk-amd64 \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL" || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "After:"; df -h /

      # fetch-depth: 0 is load-bearing, not hygiene (beid#491). The default
      # depth-1 checkout is a shallow clone, and `git rev-list --count HEAD` on
      # a shallow clone does not fail and does not return empty -- it returns a
      # PLAUSIBLE SMALLER NUMBER. The git height would then be silently wrong in
      # a shipped build, with nothing to distinguish it from a right one. iOS
      # meets the same requirement by deepening in ci_post_clone.sh; Android
      # meets it here.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate git height
        id: git-height
        run: |
          set -euo pipefail
          # Guard on shallowness, not on emptiness: an emptiness check cannot
          # see a truncated height, which is the only failure that actually
          # happens here.
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::Repository is a shallow clone; git height would be truncated."
            exit 1
          fi
          git_height="$(git rev-list --count HEAD)"
          if [[ ! "$git_height" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Computed git height is not a positive integer: '$git_height'"
            exit 1
          fi
          printf 'BEID_GIT_HEIGHT=%s\n' "$git_height" >> "$GITHUB_ENV"
          echo "Git height: $git_height"

      - name: Setup Java (hosted runners only)
        if: runner.environment == 'github-hosted'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      # resolve_kmp_java_home.sh only has macOS-shaped detection branches
      # (Homebrew paths, Android Studio's bundled JBR, /usr/libexec/java_home);
      # none of them exist on a Linux runner. Its KMP_JAVA_HOME override branch
      # is the one path that can succeed here, so point it at the JDK
      # setup-java just installed.
      - name: Point resolve_kmp_java_home.sh at the hosted JDK
        if: runner.environment == 'github-hosted'
        run: echo "KMP_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      # build-and-sign-android.sh hard-fails if these exact components are
      # missing under ANDROID_HOME. emi has them pre-provisioned; a hosted
      # runner's bundled SDK is not guaranteed to, so install explicitly
      # rather than depend on what a given runner image happens to ship.
      - name: Install required Android SDK components (hosted runners only)
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          # `sdkmanager --licenses` stops reading once every licence is
          # accepted, so `yes` is killed by SIGPIPE and exits 141. Under
          # `pipefail` that becomes the pipeline's status and `set -e` aborts
          # the step -- the failure this workflow died on (`yes: standard
          # output: Broken pipe`, run 33724513582, 2026-09-03).
          #
          # `(yes || true)` absorbs the death of `yes` ONLY. Do not write
          # `... || true` on the whole pipeline instead: that also swallows a
          # genuine sdkmanager failure, turning a loud failure into a silent
          # one. sdkmanager's own exit status still reaches `pipefail` here,
          # and the unpiped call below is untouched.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      # emi keeps the keystore, service-account JSON, and passwords in a
      # runner-local $PLAY_CRED_DIR/env file (see docs/google-play.md) because
      # it is a persistent machine. A hosted runner is a fresh VM every run,
      # so there is no local state to read here -- decode the same five
      # variables from GitHub Secrets into a fresh, mode-600 env file instead,
      # then point PLAY_CRED_DIR at it. check-play-delivery.sh and
      # build-and-sign-android.sh are already filename- and path-agnostic
      # (they only care about PLAY_CRED_DIR/env existing with these five
      # names), so nothing below this step needs to change per runner type.
      - name: Synthesize Play credentials from GitHub Secrets (hosted runners only)
        if: runner.environment == 'github-hosted'
        env:
          PLAY_KEYSTORE_B64: ${{ secrets.PLAY_KEYSTORE_B64 }}
          PLAY_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_B64 }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
          RESOLVED_PLAY_KEY_ALIAS: ${{ vars.PLAY_KEY_ALIAS || 'beid-upload' }}
        run: |
          set -euo pipefail
          for name in PLAY_KEYSTORE_B64 PLAY_SERVICE_ACCOUNT_JSON_B64 PLAY_KEYSTORE_PASSWORD PLAY_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing $name secret. Set it with 'gh secret set $name --repo thegreeting/beid' before running this workflow on a hosted runner."
              exit 1
            fi
          done

          cred_dir="$RUNNER_TEMP/play-creds"
          mkdir -m 700 -p "$cred_dir"
          echo "$PLAY_KEYSTORE_B64" | base64 --decode > "$cred_dir/upload.jks"
          echo "$PLAY_SERVICE_ACCOUNT_JSON_B64" | base64 --decode > "$cred_dir/service-account.json"
          chmod 600 "$cred_dir/upload.jks" "$cred_dir/service-account.json"

          {
            printf 'PLAY_SERVICE_ACCOUNT_JSON=%s\n' "$cred_dir/service-account.json"
            printf 'PLAY_KEYSTORE_PATH=%s\n' "$cred_dir/upload.jks"
            printf 'PLAY_KEY_ALIAS=%s\n' "$RESOLVED_PLAY_KEY_ALIAS"
            printf 'PLAY_KEYSTORE_PASSWORD=%s\n' "$PLAY_KEYSTORE_PASSWORD"
            printf 'PLAY_KEY_PASSWORD=%s\n' "$PLAY_KEY_PASSWORD"
          } > "$cred_dir/env"
          chmod 600 "$cred_dir/env"

          echo "PLAY_CRED_DIR=$cred_dir" >> "$GITHUB_ENV"

      - name: Validate runner-local Play credentials
        run: scripts/gha/check-play-delivery.sh
      - name: Build and sign release AAB
        run: scripts/gha/build-and-sign-android.sh
      # The release notes testers read are produced here rather than by the
      # upload action: r0adkll/upload-google-play reads whatsnew-<locale> files
      # verbatim and does not enforce Google Play's 500-character limit, so a
      # longer note would be rejected by the Play API *after* the bundle had
      # already been uploaded. prepare_testflight_notes.py clips it and says so
      # in the log (beid#503). --platform android prefers
      # what_to_test.android.json and falls back to what_to_test.json.
      - name: Prepare Google Play release notes
        run: |
          set -euo pipefail
          python3 scripts/prepare_testflight_notes.py \
            --platform android \
            --repo-root . \
            --skip-empty \
            --play-output-dir "$RUNNER_TEMP/whatsnew"
      - name: Upload AAB to Google Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.levarac.beid
          releaseFiles: ${{ env.ANDROID_AAB_PATH }}
          tracks: internal
          status: completed
          releaseName: GHA ${{ env.ANDROID_VERSION_CODE }}
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
